<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CYBER AR - PORTFOLIO FINAL</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:#000;
}

:root{
--accent:#D99A3E;
--ink:#F6F1E4;
}

/* HUD: マーカー検出中（未ロック） */
.hud-scan{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
pointer-events:none;
z-index:10001;
}

.reticle{
position:relative;
width:120px;
height:120px;
margin-bottom:14px;
}

.reticle .corner{
position:absolute;
width:18px;
height:18px;
border-color:var(--accent);
opacity:.85;
}
.reticle .corner.tl{top:0;left:0;border-top:2px solid;border-left:2px solid;}
.reticle .corner.tr{top:0;right:0;border-top:2px solid;border-right:2px solid;}
.reticle .corner.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid;}
.reticle .corner.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid;}

.scanline{
position:absolute;
left:8%;
right:8%;
height:1px;
top:12%;
background:linear-gradient(90deg,transparent,rgba(217,154,62,0.85),transparent);
animation:scanmove 2.4s ease-in-out infinite;
}

@keyframes scanmove{
0%,100%{top:12%;}
50%{top:88%;}
}

@media (prefers-reduced-motion:reduce){
.scanline{animation:none; top:50%;}
}

.scan-status{
font-family:monospace;
font-size:11px;
letter-spacing:.14em;
text-transform:uppercase;
color:var(--accent);
text-shadow:0 0 6px rgba(217,154,62,.6);
}

/* HUD: マーカーロック後 */
.hud-locked{
position:fixed;
top:20px;
left:20px;
display:none;
align-items:center;
gap:6px;
font-family:monospace;
font-size:11px;
letter-spacing:.1em;
text-transform:uppercase;
color:rgba(246,241,228,.85);
pointer-events:none;
z-index:10001;
}

.pulse-dot{
width:7px;
height:7px;
border-radius:50%;
background:var(--accent);
box-shadow:0 0 6px var(--accent);
flex-shrink:0;
}


/* SNS */

.sns-container{
position:fixed;
bottom:25px;
right:25px;
display:flex;
flex-direction:row-reverse;
gap:14px;
z-index:10002;
}

#insta-link,
#x-link,
#line-link{
display:none;
}

.btn-border-shadow{
display:flex;
justify-content:center;
align-items:center;
width:28px;
height:28px;
cursor:pointer;
text-decoration:none;
background:rgba(0,0,0,0.35);
border:1px solid rgba(255,255,255,0.55);
border-radius:50%;
transition:background .2s ease;
}

.btn-border-shadow:hover{
background:rgba(0,0,0,0.55);
}

.btn-border-shadow img{
width:55%;
height:55%;
object-fit:contain;
}

</style>
</head>

<body>

<div class="hud-scan" id="hudScan">
<div class="reticle">
<span class="corner tl"></span><span class="corner tr"></span>
<span class="corner bl"></span><span class="corner br"></span>
<span class="scanline"></span>
</div>
<div class="scan-status">Searching Marker…</div>
</div>

<div class="hud-locked" id="hudLocked">
<span class="pulse-dot"></span>Tracking
</div>


<div class="sns-container">

<a href="#" id="line-link" target="_blank" class="btn-border-shadow">
<img src="assets/icons/LINE.png">
</a>

<a href="#" id="x-link" target="_blank" class="btn-border-shadow">
<img src="assets/icons/X.png">
</a>

<a href="#" id="insta-link" target="_blank" class="btn-border-shadow">
<img src="assets/icons/instagram.png">
</a>

</div>


<a-scene
embedded
arjs="sourceType:webcam; debugUIEnabled:false;"
vr-mode-ui="enabled:false"
>

<a-marker type="pattern" url="assets/markers/pattern-AKA2.patt"></a-marker>

<a-entity camera></a-entity>

</a-scene>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAHJPzHf4QR3V4GOcd0l3s-_VvSSYeWZAA",
authDomain:"armisetai.firebaseapp.com",
projectId:"armisetai",
storageBucket:"armisetai.firebasestorage.app",
messagingSenderId:"1006973944547",
appId:"1:1006973944547:web:adc5e195039585bbdabbd6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


let currentIndex=0;
let items=[];
let dotsPlane=null;


/* 日本語Canvas */

function createTextTexture(text,color,fontSize="50px",align="center"){

const canvas=document.createElement("canvas");
canvas.width=512;
canvas.height=128;

const ctx=canvas.getContext("2d");

ctx.clearRect(0,0,512,128);
ctx.fillStyle=color;
ctx.font=`bold ${fontSize} "Noto Sans JP",sans-serif`;
ctx.textBaseline="middle";

if(align==="left"){
ctx.textAlign="left";
ctx.fillText(text,28,64);
}else{
ctx.textAlign="center";
ctx.fillText(text,256,64);
}

return canvas.toDataURL();

}


/* 肩書き（先頭にアクセントの小さな四角） */

function createJobTexture(text,color,accentColor){

const canvas=document.createElement("canvas");
canvas.width=512;
canvas.height=128;

const ctx=canvas.getContext("2d");

ctx.clearRect(0,0,512,128);

ctx.fillStyle=accentColor;
ctx.fillRect(28,59,10,10);

ctx.fillStyle=color;
ctx.font=`500 34px "Noto Sans JP",sans-serif`;
ctx.textAlign="left";
ctx.textBaseline="middle";
ctx.fillText(text,50,64);

return canvas.toDataURL();

}


/* 写真下部のグラデーションスクリム */

function createScrimTexture(ratio){
  const W=512;
  const H=Math.round(512*(ratio||1));
  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,H*0.58,0,H);
  grad.addColorStop(0,"rgba(10,8,4,0)");
  grad.addColorStop(0.45,"rgba(10,8,4,0.6)");
  grad.addColorStop(1,"rgba(10,8,4,0.92)");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  return canvas.toDataURL();
}


/* カルーセル位置インジケータ */

function createDotsTexture(count,activeIndex){
  const W=512, H=40, gap=10;
  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,W,H);
  const segW=(W-gap*(count-1))/count;
  for(let i=0;i<count;i++){
    const x=i*(segW+gap);
    ctx.fillStyle=i===activeIndex?"#F6F1E4":"rgba(255,255,255,0.35)";
    roundRect(ctx,x,H/2-3,segW,6,3);
    ctx.fill();
  }
  return canvas.toDataURL();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}



window.addEventListener("load",()=>{

const marker=document.querySelector("a-marker");

const urlParams=new URLSearchParams(window.location.search);
const markerId=urlParams.get("id") || "akazawa";

console.log("AR profile:",markerId);

const hudScan=document.getElementById("hudScan");
const hudLocked=document.getElementById("hudLocked");

marker.addEventListener("markerFound",()=>{
hudScan.style.display="none";
hudLocked.style.display="flex";
});

marker.addEventListener("markerLost",()=>{
hudScan.style.display="flex";
hudLocked.style.display="none";
});


/* SNSボタン */

const lineBtn=document.getElementById("line-link");
const xBtn=document.getElementById("x-link");
const instaBtn=document.getElementById("insta-link");


function setSNS(button,url){

if(url && url.trim()!==""){

button.href=url;
button.style.display="flex";

}else{

button.style.display="none";

}

}


/* Firestore */

onSnapshot(doc(db,"arUsers",markerId),(docSnap)=>{

if(!docSnap.exists()) return;

const data=docSnap.data();


setSNS(lineBtn,data.line);
setSNS(xBtn,data.x);
setSNS(instaBtn,data.instagram);


const images=data.images || [];
const ratios=data.ratios || [];


while(marker.firstChild){
marker.removeChild(marker.firstChild);
}

items=[];
dotsPlane=null;
currentIndex=0;

const baseW=1.3;
const maxRatio=ratios.length>0?Math.max(...ratios):1;

const nameColor=data.nameColor||"#F6F1E4";
const jobColor=data.jobColor||"#CBB99E";
const accentColor=data.accentColor||"#D99A3E";

images.forEach((url,i)=>{

const container=document.createElement("a-entity");
container.setAttribute("visible","false");

const ratio=ratios[i]||1;
const imgH=baseW*ratio;

const aImg=document.createElement("a-image");
aImg.setAttribute("src",url);
aImg.setAttribute("rotation","-90 0 0");
aImg.setAttribute("material","shader:flat;transparent:true;side:double");
aImg.setAttribute("width",baseW);
aImg.setAttribute("height",imgH.toFixed(3));
aImg.setAttribute("position","0 0.02 0");
container.appendChild(aImg);

// 写真下部のグラデーションスクリム
const scrim=document.createElement("a-plane");
scrim.setAttribute("rotation","-90 0 0");
scrim.setAttribute("width",baseW.toFixed(3));
scrim.setAttribute("height",imgH.toFixed(3));
scrim.setAttribute("position","0 0.025 0");
scrim.setAttribute("material",{src:createScrimTexture(ratio),transparent:true,shader:"flat"});
container.appendChild(scrim);

// 名前・肩書き（写真に重ねて左寄せ）
const namePlane=document.createElement("a-plane");
namePlane.setAttribute("rotation","-90 0 0");
namePlane.setAttribute("width",baseW.toFixed(3));
namePlane.setAttribute("height","0.16");
namePlane.setAttribute("position",`0 0.03 ${(imgH/2-0.30).toFixed(3)}`);
namePlane.setAttribute("material",{src:createTextTexture(data.name||"NO NAME",nameColor,"56px","left"),transparent:true,shader:"flat"});
container.appendChild(namePlane);

const jobPlane=document.createElement("a-plane");
jobPlane.setAttribute("rotation","-90 0 0");
jobPlane.setAttribute("width",baseW.toFixed(3));
jobPlane.setAttribute("height","0.11");
jobPlane.setAttribute("position",`0 0.031 ${(imgH/2-0.12).toFixed(3)}`);
jobPlane.setAttribute("material",{src:createJobTexture(data.job||"NO TITLE",jobColor,accentColor),transparent:true,shader:"flat"});
container.appendChild(jobPlane);

marker.appendChild(container);
items.push(container);

});

// カルーセル位置インジケータ（写真が複数あるときのみ）
if(images.length>1){

dotsPlane=document.createElement("a-plane");
dotsPlane.setAttribute("rotation","-90 0 0");
dotsPlane.setAttribute("width",(baseW*0.5).toFixed(3));
dotsPlane.setAttribute("height","0.05");
dotsPlane.setAttribute("position",`0 0.04 ${(-(baseW*maxRatio)/2+0.12).toFixed(3)}`);
dotsPlane.setAttribute("material",{src:createDotsTexture(images.length,currentIndex),transparent:true,shader:"flat"});
marker.appendChild(dotsPlane);

}


updateCarousel();

});


function updateCarousel(){

items.forEach((item,index)=>{

const isCenter=(index===currentIndex);
const offset=(index-currentIndex)*1.5; // 画像幅1.3+余白0.2

item.setAttribute("visible",Math.abs(index-currentIndex)<=1);

item.setAttribute("position",{
x:offset,
y:isCenter?0.2:0.1,
z:0
});

item.setAttribute("scale",isCenter?"1 1 1":"0.7 0.7 0.7");

});

if(dotsPlane){
dotsPlane.setAttribute("material","src",createDotsTexture(items.length,currentIndex));
}

}


/* クリック操作 */

window.addEventListener("click",()=>{

if(items.length===0) return;

currentIndex=(currentIndex+1)%items.length;

updateCarousel();

});


/* スワイプ操作 */

let startX=0;

window.addEventListener("touchstart",(e)=>{

startX=e.touches[0].clientX;

});

window.addEventListener("touchend",(e)=>{

let diff=e.changedTouches[0].clientX-startX;

if(Math.abs(diff)>50){

currentIndex=diff>0
?(currentIndex-1+items.length)%items.length
:(currentIndex+1)%items.length;

updateCarousel();

}

});

});

</script>

</body>
</html>

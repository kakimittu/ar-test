   -----------------------------------------------------------
   Firestore には templateId と color だけ持たせる。
   素材の画像はこのファイル内に data URI で埋め込んである（外部フォルダ不要）。

   =========================================================== */

      { src:'heart',    x:-0.24, y:-0.42, s:0.10, op:0.85, anim:'float',dur:3200, delay:1400 },
      { src:'sparkle',  x:-0.44, y:-0.36, s:0.12, op:1.0,  anim:'twinkle', dur:1700, delay:300 },
      { src:'sparkle',  x: 0.22, y:-0.44, s:0.10, op:1.0,  anim:'twinkle', dur:2200, delay:1000}
    ]
  }

};

function buildFx(container, tpl, color){
  while(container.firstChild) container.removeChild(container.firstChild);
  const col = color || tpl.color;

  tpl.sprites.forEach(sp=>{
    /* a-image プリミティブは使わない。
       material を文字列で上書きすると src が消えて「黒い四角」になるため、
       geometry と material をオブジェクトで明示指定する。 */
    const el = document.createElement('a-entity');
    el.setAttribute('geometry', {primitive:'plane', width:sp.s, height:sp.s});
    el.setAttribute('material', {
      shader:'flat',
      src:'#fx_'+sp.src,
      transparent:true,
      alphaTest:0.01,
      color:col,
      opacity:sp.op,
      side:'double'
    });
    el.setAttribute('position', {x:sp.x, y:sp.y, z:0.01});

    const dur = sp.dur, delay = sp.delay || 0, dir = sp.dir || 1;

    switch(sp.anim){
      case 'spin':
        el.setAttribute('animation', `property: rotation; to: 0 0 ${360*dir}; loop: true; dur: ${dur}; easing: linear; delay: ${delay}`);
        break;
      case 'float':
        el.setAttribute('animation', `property: position; to: ${sp.x} ${sp.y+0.09} 0.01; dir: alternate; loop: true; dur: ${dur}; easing: easeInOutSine; delay: ${delay}`);
        break;
      case 'pulse':
        el.setAttribute('animation', `property: scale; from: 0.85 0.85 1; to: 1.15 1.15 1; dir: alternate; loop: true; dur: ${dur}; easing: easeInOutSine; delay: ${delay}`);
        break;
      case 'twinkle':
        el.setAttribute('animation',    `property: material.opacity; from: ${sp.op}; to: 0.05; dir: alternate; loop: true; dur: ${dur}; easing: easeInOutQuad; delay: ${delay}`);
        el.setAttribute('animation__s', `property: scale; from: 1 1 1; to: 0.55 0.55 1; dir: alternate; loop: true; dur: ${dur}; easing: easeInOutQuad; delay: ${delay}`);
        break;
      case 'fall':
        el.setAttribute('animation',    `property: position; from: ${sp.x} ${sp.y} 0.01; to: ${sp.x-0.12} ${sp.y-0.95} 0.01; loop: true; dur: ${dur}; easing: linear; delay: ${delay}`);
        el.setAttribute('animation__r', `property: rotation; to: 0 0 ${210*dir}; loop: true; dur: ${dur}; easing: linear; delay: ${delay}`);
        break;
      case 'drift':
        el.setAttribute('animation',    `property: position; to: ${sp.x + 0.16*dir} ${sp.y-0.30} 0.01; dir: alternate; loop: true; dur: ${dur}; easing: easeInOutSine; delay: ${delay}`);
        el.setAttribute('animation__r', `property: rotation; to: 0 0 ${180*dir}; dir: alternate; loop: true; dur: ${dur}; easing: easeInOutSine; delay: ${delay}`);
        break;
      default:
        el.setAttribute('animation', `property: rotation; to: 0 0 ${360*dir}; loop: true; dur: ${dur}; easing: linear; delay: ${delay}`);
    }
    container.appendChild(el);
  });
}

/* --- パラメータ取得（実運用では Firestore の値に置き換え） --- */
const q     = new URLSearchParams(location.search);

/* ?mind=... でマーカーファイルを差し替えられる（未指定なら既定のまま） */
const mindParam = q.get('mind');
if (mindParam) {
  const sc = document.querySelector('#scene');
  sc.setAttribute('mindar-image', 'imageTargetSrc', mindParam);
}

const tplId = q.get('fx')    || 'sparkle_gold';
const color = q.get('color') || null;
const tpl   = FX_TEMPLATES[tplId] || FX_TEMPLATES.sparkle_gold;

buildFx(document.querySelector('#fx'), tpl, color);

/* --- 認識したら案内を消す --- */
const target = document.querySelector('#target');
const scan   = document.querySelector('#scan');
target.addEventListener('targetFound', ()=> scan.classList.add('hide'));
target.addEventListener('targetLost',  ()=> scan.classList.remove('hide'));
</script>

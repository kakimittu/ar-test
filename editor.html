<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AR EDITOR</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500&family=Playfair+Display:wght@700&family=Caveat:wght@700&family=Aloha:wght@400&display=swap" rel="stylesheet">

<style>
@font-face{
  font-family:'CorporateMincho';
  src:url('./assets/fonts/Corporate-Mincho-ver3.woff2') format('woff2'),
      url('./assets/fonts/Corporate-Mincho-ver3.woff2') format('woff');
  font-display: swap;
  font-weight: normal;
  font-style: normal;
}

body {
  margin: 0;
  font-family: 'Noto Sans JP', 'Roboto', sans-serif;
  background: #09090b;
  color: #f4f4f5;
  overflow: hidden;
  height: 100vh;
}

#app-wrapper {
  display: flex;
  height: 100vh;
}

#controls {
  flex: 0 0 480px;
  padding: 24px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 24px;
  overflow-y: auto;
  height: 100vh;
}

/* スクロールバーのカスタマイズ */
#controls::-webkit-scrollbar {
  width: 6px;
}
#controls::-webkit-scrollbar-thumb {
  background: #27272a;
  border-radius: 3px;
}

/* タイトルスタイル */
h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #06b6d4; /* 高級感のあるアクア */
  border-bottom: 1px solid #27272a;
  padding-bottom: 16px;
}

/* セクション（カード）ごとのまとまり */
.section-box {
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #71717a;
  margin-bottom: 4px;
  font-weight: 700;
}

/* 入力グループ */
.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

label {
  font-size: 12px;
  font-weight: 500;
  color: #a1a1aa;
}

/* フォーム要素の共通モダンデザイン */
input[type="text"], select, input[type="color"], input[type="range"] {
  width: 100%;
  padding: 10px 12px;
  background: #202024;
  border: 1px solid #3f3f46;
  color: #fff;
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 13px;
  transition: all 0.2s ease;
}

input[type="range"] {
  padding: 0;
  height: 6px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #06b6d4;
  cursor: pointer;
  transition: all 0.2s ease;
}

input[type="range"]::-webkit-slider-thumb:hover {
  background: #22d3ee;
  transform: scale(1.2);
}

input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #06b6d4;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

input[type="range"]::-moz-range-thumb:hover {
  background: #22d3ee;
  transform: scale(1.2);
}

input[type="text"]:focus, select:focus, input[type="color"]:focus {
  outline: none;
  border-color: #06b6d4;
  box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.15);
}

input[type="color"] {
  height: 44px;
  cursor: pointer;
}

input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 2px;
}

input[type="color"]::-webkit-color-swatch {
  border: none;
  border-radius: 4px;
}

/* ファイル入力のカスタム */
.file-input-wrapper {
  position: relative;
  display: inline-block;
  width: 100%;
}

input[type="file"] {
  width: 100%;
  padding: 8px;
  background: #202024;
  border: 1px dashed #3f3f46;
  color: #a1a1aa;
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 12px;
  cursor: pointer;
}

input[type="file"]:hover {
  border-color: #06b6d4;
}

#fileList {
  margin-top: 4px;
  font-size: 11px;
  color: #71717a;
  text-align: right;
}

select {
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 16px;
  padding-right: 40px;
}

select option {
  background: #202024;
  color: #fff;
}

/* 保存ボタン */
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  font-size: 14px;
  letter-spacing: 0.05em;
  cursor: pointer;
  margin-top: 10px;
  background: #06b6d4;
  color: #09090b;
  transition: all 0.2s ease;
}

.btn:hover {
  background: #22d3ee;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  background: #27272a;
  color: #71717a;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ── プレビューパネル ── */
#preview-panel {
  flex: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0d0d0f;
  border-left: 1px solid #27272a;
  padding: 24px;
  box-sizing: border-box;
  overflow: hidden;
}

.preview-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #71717a;
  margin-bottom: 16px;
  font-weight: 700;
}

.phone-frame {
  width: 260px;
  height: 528px;
  background: #1c1c1e;
  border: 6px solid #3a3a3c;
  border-radius: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 8px 10px;
  box-sizing: border-box;
  box-shadow: 0 0 0 2px #555, 0 20px 60px rgba(0,0,0,0.8), inset 0 0 0 1px #2a2a2a;
  position: relative;
}

.phone-notch {
  width: 70px;
  height: 10px;
  background: #111;
  border-radius: 5px;
  margin-bottom: 10px;
  flex-shrink: 0;
}

.phone-screen {
  width: 100%;
  flex: 1;
  background: #050508;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

.phone-home {
  width: 80px;
  height: 4px;
  background: #444;
  border-radius: 2px;
  margin-top: 10px;
  flex-shrink: 0;
}

#preview-camera-bg {
  width: 100%;
  height: 100%;
  background: #080810;
  position: relative;
  overflow: hidden;
}

#preview-camera-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(rgba(0,242,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,242,255,0.025) 1px, transparent 1px);
  background-size: 18px 18px;
  pointer-events: none;
  z-index: 1;
}

#preview-photo {
  position: absolute;
  object-fit: cover;
  display: none;
  z-index: 2;
}

#preview-effect {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 3;
  pointer-events: none;
}

#preview-effect span {
  position: absolute;
  color: var(--preview-effect-color, #FFD44D);
  font-size: 28px;
  line-height: 1;
  text-shadow: 0 0 10px currentColor;
  animation: preview-effect-twinkle 1.6s ease-in-out infinite alternate;
}

#preview-effect span:nth-child(1) { left: 12%; top: 28%; }
#preview-effect span:nth-child(2) { right: 12%; top: 35%; animation-delay: .35s; }
#preview-effect span:nth-child(3) { left: 20%; bottom: 25%; animation-delay: .7s; }
#preview-effect span:nth-child(4) { right: 20%; bottom: 22%; animation-delay: 1s; }

@keyframes preview-effect-twinkle {
  from { transform: scale(.7) rotate(0deg); opacity: .35; }
  to { transform: scale(1.15) rotate(25deg); opacity: 1; }
}

/* 写真上部に落ちる、名札が浮いていることを示す影 */
#preview-shadow {
  position: absolute;
  z-index: 4;
  display: none;
  pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.5), transparent 72%);
  filter: blur(2px);
}

/* 写真の上に浮く名札（index.html の plateGroup と同じ考え方） */
#preview-plate-anchor {
  position: absolute;
  z-index: 5;
  display: none;
  pointer-events: none;
}

.preview-plate-center {
  transform: translate(-50%, -100%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.preview-plate-bob {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding-bottom: 6px;
  animation: previewBob 2.2s ease-in-out infinite;
}

@keyframes previewBob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

#preview-name {
  font-weight: bold;
  white-space: nowrap;
  text-align: center;
  text-shadow: 0 0 10px rgba(0,0,0,0.6);
}

#preview-job {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  white-space: nowrap;
  text-shadow: 0 0 10px rgba(0,0,0,0.6);
}

#preview-job-dot {
  flex-shrink: 0;
}

.scan-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,242,255,0.5), transparent);
  z-index: 10;
  animation: scan 3s linear infinite;
  pointer-events: none;
}

@keyframes scan {
  0%   { top: 0;    opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

.hud-corner {
  position: absolute;
  width: 14px;
  height: 14px;
  z-index: 10;
  pointer-events: none;
}
.hud-corner.tl { top: 6px;    left: 6px;  border-top: 2px solid rgba(0,242,255,0.8); border-left: 2px solid rgba(0,242,255,0.8); }
.hud-corner.tr { top: 6px;    right: 6px; border-top: 2px solid rgba(0,242,255,0.8); border-right: 2px solid rgba(0,242,255,0.8); }
.hud-corner.bl { bottom: 6px; left: 6px;  border-bottom: 2px solid rgba(0,242,255,0.8); border-left: 2px solid rgba(0,242,255,0.8); }
.hud-corner.br { bottom: 6px; right: 6px; border-bottom: 2px solid rgba(0,242,255,0.8); border-right: 2px solid rgba(0,242,255,0.8); }

.preview-hint {
  margin-top: 14px;
  font-size: 11px;
  color: #52525b;
  text-align: center;
  line-height: 1.7;
}

/* ── ログイン画面 ── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.login-card {
  width: 320px;
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 8px;
  padding: 28px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.login-card h2 {
  border-bottom: none;
  padding-bottom: 0;
  margin-bottom: 4px;
}

#loginError {
  color: #f87171;
  font-size: 12px;
  min-height: 16px;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #27272a;
  padding-bottom: 16px;
}
.header-row h2 { border-bottom: none; padding-bottom: 0; }

#logoutBtn {
  background: transparent;
  border: 1px solid #3f3f46;
  color: #a1a1aa;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
}
#logoutBtn:hover { border-color: #06b6d4; color: #06b6d4; }

/* ── ドキュメントID行（ランダム生成ボタン付き） ── */
.id-row {
  display: flex;
  gap: 8px;
}
.id-row input { flex: 1; }
.id-row button {
  flex-shrink: 0;
  padding: 0 12px;
  background: #202024;
  border: 1px solid #3f3f46;
  color: #d4d4d8;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.id-row button:hover { border-color: #06b6d4; color: #06b6d4; }

@media (max-width: 900px) {
  body { overflow-y: auto; overflow-x: hidden; height: auto; }
  #app-wrapper { flex-direction: column; height: auto; }
  #controls { flex: none; width: 100%; height: auto; overflow-y: visible; }
  #preview-panel { height: 640px; border-left: none; border-top: 1px solid #27272a; flex: none; width: 100%; }
}

</style>
</head>

<body>

<div id="login-screen">
  <div class="login-card">
    <h2>AR EDITOR</h2>
    <div class="input-group">
      <label>メールアドレス</label>
      <input type="text" id="loginEmail" autocomplete="username">
    </div>
    <div class="input-group">
      <label>パスワード</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button id="loginBtn" type="button" class="btn">ログイン</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="app-wrapper" style="display:none;">

<div id="controls">

  <div class="header-row">
    <h2>AR EDITOR</h2>
    <button id="logoutBtn" type="button">ログアウト</button>
  </div>

<div class="section-box">
    <div class="section-title">System Settings</div>
    <div class="input-group">
      <label>ドキュメントID</label>
      <div class="id-row">
        <input type="text" id="markerId" value="akazawa">
        <button type="button" id="generateIdBtn">ランダム生成</button>
      </div>
    </div>

    <div class="input-group">
      <label>MindARターゲットURL (.mind)</label>
      <input type="text" id="mindUrlInput" placeholder="assets/targets/pattern-AKA2.mind">
    </div>
  </div>

  <div class="section-box">
    <div class="section-title">Profile Content</div>
    <div class="input-group">
      <label>お名前</label>
      <input type="text" id="nameInput" value="赤澤 優子">
    </div>

    <div class="input-group">
      <label>肩書き</label>
      <input type="text" id="jobInput" value="ホーストレーナー">
    </div>

    <div class="input-group">
      <label>フォント</label>
      <select id="fontSelect">
        <option value="CorporateMincho">Corporate Mincho</option>
        <option value="Noto Sans JP">Noto Sans JP</option>
        <option value="Roboto">Roboto</option>
        <option value="Playfair Display">Playfair Display</option>
        <option value="Caveat">Caveat</option>
        <option value="Aloha">Aloha</option>
      </select>
    </div>

    <div class="input-group">
      <label>お名前の色</label>
      <input type="color" id="nameColorInput" value="#ffffff">
    </div>

    <div class="input-group">
      <label>肩書きの色</label>
      <input type="color" id="jobColorInput" value="#ffcc00">
    </div>

    <div class="input-group">
      <label>アクセントカラー</label>
      <input type="color" id="accentColorInput" value="#D99A3E">
    </div>

    <div class="input-group">
      <label>文字サイズ</label>
      <input type="range" id="fontSizeInput" min="40" max="150" value="80" step="5">
      <div style="font-size: 11px; color: #71717a; text-align: right;" id="fontSizeDisplay">80px</div>
    </div>

    <div class="input-group">
      <label>画像</label>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div id="fileList">未選択</div>
    </div>
  </div>

  <div class="section-box">
    <div class="section-title">Effect</div>
    <div class="input-group">
      <label>エフェクト</label>
      <select id="effectTemplateSelect"></select>
    </div>
    <div class="input-group">
      <label>エフェクトの色</label>
      <input type="color" id="effectColorInput" value="#FFD44D">
    </div>
  </div>

  <div class="section-box">
    <div class="section-title">Social Links</div>
    <div class="input-group">
      <label>Instagram URL</label>
      <input type="text" id="instagramInput" placeholder="https://instagram.com/username">
    </div>

    <div class="input-group">
      <label>X URL</label>
      <input type="text" id="xInput" placeholder="https://x.com/username">
    </div>

    <div class="input-group">
      <label>HP URL</label>
      <input type="text" id="HPInput" placeholder="https://example.com">
    </div>

    <div class="input-group">
      <label>LINE URL</label>
      <input type="text" id="lineInput" placeholder="https://line.me/R/ti/p/...">
    </div>
  </div>

  <button id="saveBtn" class="btn">FIRESTOREへ保存</button>

</div>

<!-- スマホプレビューパネル -->
<div id="preview-panel">
  <div class="preview-label">スマホプレビュー</div>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div id="preview-camera-bg">
        <div class="scan-line"></div>
        <div class="hud-corner tl"></div>
        <div class="hud-corner tr"></div>
        <div class="hud-corner bl"></div>
        <div class="hud-corner br"></div>
        <img id="preview-photo" src="" alt="">
        <div id="preview-effect" aria-hidden="true"><span>✦</span><span>✦</span><span>✦</span><span>✦</span></div>
        <div id="preview-shadow"></div>
        <div id="preview-plate-anchor">
          <div class="preview-plate-center">
            <div class="preview-plate-bob">
              <div id="preview-name">名前</div>
              <div id="preview-job"><span id="preview-job-dot"></span><span id="preview-job-text">肩書き</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="phone-home"></div>
  </div>
  <div class="preview-hint">index.html と同じ、写真の上にゆらゆら浮かぶ<br>名札レイアウトのプレビューです</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyAHJPzHf4QR3V4GOcd0l3s-_VvSSYeWZAA",
authDomain:"armisetai.firebaseapp.com",
projectId:"armisetai",
storageBucket:"armisetai.firebasestorage.app",
messagingSenderId:"1006973944547",
appId:"1:1006973944547:web:adc5e195039585bbdabbd6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let imagesBase64=[];
let imageRatios=[];
let photosChanged=false;
let FX_TEMPLATES={
  none: { label: "なし", color: "#FFFFFF" },
  sparkle_gold: { label: "キラキラ", color: "#FFD44D" },
  doodle_blue: { label: "手描き落書き", color: "#2B6BFF" },
  petal_pink: { label: "花びらが舞う", color: "#FF9EC4" },
  halo_white: { label: "光の輪", color: "#FFFFFF" },
  confetti_party: { label: "紙吹雪", color: "#FF6B6B" }
};

function populateFxTemplateSelect() {
  const select = document.getElementById("effectTemplateSelect");
  if (!select) return;
  select.innerHTML = "";
  Object.entries(FX_TEMPLATES).forEach(([key, tpl]) => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = tpl.label || key;
    select.appendChild(option);
  });
}

async function loadFxTemplates() {
  try {
    const res = await fetch("./fx-ar-standalone.html");
    const html = await res.text();
    const match = html.match(/const FX_TEMPLATES = (\{[\s\S]*?\n\});\s*function buildFx/);
    if (!match) return;
    const parsed = Function(`"use strict"; return (${match[1]});`)();
    FX_TEMPLATES = { none: { label: "なし", color: "#FFFFFF" }, ...parsed };
    populateFxTemplateSelect();
  } catch (e) {
    console.error("FXテンプレートの読み込みに失敗しました:", e);
  }
}

populateFxTemplateSelect();

function syncEffectColorFromTemplate() {
  const select = document.getElementById("effectTemplateSelect");
  const colorInput = document.getElementById("effectColorInput");
  if (!select || !colorInput) return;
  const selected = select.value;
  const tpl = FX_TEMPLATES[selected] || FX_TEMPLATES.none;
  colorInput.value = tpl.color || "#FFFFFF";
  updatePreview();
}

document.getElementById("effectTemplateSelect")?.addEventListener("change", syncEffectColorFromTemplate);
document.getElementById("effectColorInput")?.addEventListener("input", updatePreview);

document.getElementById("fileInput").onchange=async(e)=>{

const files=[...e.target.files];
if(files.length===0) return;

photosChanged=true;
imagesBase64=[];
imageRatios=[];

document.getElementById("fileList").innerText=files.length+"枚選択";

for(const file of files){

const result=await processImage(file);

imagesBase64.push(result.data);
imageRatios.push(result.ratio);

}

updatePreview();

};

/* ドキュメントIDのランダム生成（推測されにくいIDで新規顧客を作成） */
function generateRandomId(len = 8) {
  const chars = "abcdefghijkmnpqrstuvwxyz23456789"; // 紛らわしい文字(0,1,l,i,o)は除外
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let id = "";
  for (let i = 0; i < len; i++) id += chars[arr[i] % chars.length];
  return id;
}

function resetFormForNewEntry() {
  document.getElementById("mindUrlInput").value = "";
  document.getElementById("nameInput").value = "";
  document.getElementById("jobInput").value = "";
  document.getElementById("fontSelect").value = "CorporateMincho";
  document.getElementById("nameColorInput").value = "#ffffff";
  document.getElementById("jobColorInput").value = "#ffcc00";
  document.getElementById("accentColorInput").value = "#D99A3E";
  document.getElementById("fontSizeInput").value = "80";
  document.getElementById("effectTemplateSelect").value = "none";
  document.getElementById("effectColorInput").value = "#FFFFFF";
  document.getElementById("instagramInput").value = "";
  document.getElementById("xInput").value = "";
  document.getElementById("HPInput").value = "";

};

["fontSizeInput"].forEach(id=>{
const el = document.getElementById(id);
el.addEventListener("input",()=>{ updateDisplayValue(id); updatePreview(); });
});

function updateDisplayValue(id) {
  const el = document.getElementById(id);
  const displayId = id.replace(/Input$/, "") + "Display";
  const displayEl = document.getElementById(displayId);
  if (displayEl) {
    if (id === "fontSizeInput") {
      displayEl.textContent = el.value + "px";
    } else {
      displayEl.textContent = el.value;
    }
  }
}

// テキスト・色・フォント変更でもプレビューを更新
["nameInput","jobInput","fontSelect","nameColorInput","jobColorInput","accentColorInput"].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener("input", updatePreview);
  if(el) el.addEventListener("change", updatePreview);
});

function processImage(file){

return new Promise(resolve=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const canvas=document.createElement("canvas");

const maxW=800;
const ratio=img.height/img.width;

canvas.width=maxW;
canvas.height=maxW*ratio;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,canvas.width,canvas.height);

resolve({
data:canvas.toDataURL("image/jpeg",0.7),
ratio:ratio
});

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

});

}

/* ── CSS ベースのリアルタイムプレビュー ──
   index.html の実レイアウト（写真は無加工のまま、上に浮く名札＋影）に合わせる */
function updatePreview() {
  const screen = document.getElementById("preview-camera-bg");
  if (!screen) return;

  const screenW = screen.offsetWidth || 244;
  const screenH = screen.offsetHeight || 462;

  const nameVal     = document.getElementById("nameInput").value || "名前";
  const jobVal      = document.getElementById("jobInput").value  || "肩書き";
  const fontVal     = document.getElementById("fontSelect").value;
  const fontSizeVal = parseInt(document.getElementById("fontSizeInput").value) || 80;
  const nameColor   = document.getElementById("nameColorInput").value;
  const jobColor    = document.getElementById("jobColorInput").value;
  const accentColor = document.getElementById("accentColorInput").value;
  const effectTemplate = document.getElementById("effectTemplateSelect")?.value || "none";
  const effectColor = document.getElementById("effectColorInput")?.value || "#FFD44D";

  const ratio  = imageRatios[0] || 1;
  const photoW = screenW * 0.86;
  const photoH = photoW * ratio;
  const left   = (screenW - photoW) / 2;

  // 名札＋影のぶん、写真の上に一定の余白を確保してから残りを中央寄せする
  const extraTop = photoW * 0.32;
  const top = extraTop + Math.max(0, (screenH - extraTop - photoH) / 2);

  const photoEl = document.getElementById("preview-photo");
  if (imagesBase64.length > 0) {
    photoEl.src = imagesBase64[0];
    photoEl.style.display = "block";
  } else {
    photoEl.style.display = "none";
  }
  photoEl.style.width  = photoW + "px";
  photoEl.style.height = photoH + "px";
  photoEl.style.left   = left + "px";
  photoEl.style.top    = top + "px";

  const effectEl = document.getElementById("preview-effect");
  effectEl.style.display = effectTemplate === "none" ? "none" : "block";
  effectEl.style.setProperty("--preview-effect-color", effectColor);

  // 影：写真の上端近くに落とす
  const shadowEl = document.getElementById("preview-shadow");
  const shadowW  = photoW * 0.5;
  const shadowH  = Math.max(8, photoW * 0.045);
  shadowEl.style.display = imagesBase64.length > 0 ? "block" : "none";
  shadowEl.style.width  = shadowW + "px";
  shadowEl.style.height = shadowH + "px";
  shadowEl.style.left   = (left + photoW / 2 - shadowW / 2) + "px";
  shadowEl.style.top    = (top + photoH * 0.06) + "px";

  // 名札：写真の外側・上に浮かせる（index.html の plateGroup と同じ考え方）
  const gapPx = photoW * (0.20 / 1.3);
  const plateAnchorEl = document.getElementById("preview-plate-anchor");
  plateAnchorEl.style.display = "block";
  plateAnchorEl.style.left = (left + photoW / 2) + "px";
  plateAnchorEl.style.top  = (top - gapPx) + "px";

  const previewFontSize = Math.max(9, Math.round(fontSizeVal * 0.16));

  const nameEl = document.getElementById("preview-name");
  nameEl.textContent      = nameVal;
  nameEl.style.color      = nameColor;
  nameEl.style.fontFamily = `"${fontVal}", sans-serif`;
  nameEl.style.fontSize   = previewFontSize + "px";

  const jobFontSize = Math.round(previewFontSize * 0.78);

  const dotEl = document.getElementById("preview-job-dot");
  dotEl.style.background = accentColor;
  dotEl.style.width  = Math.max(4, Math.round(jobFontSize * 0.3)) + "px";
  dotEl.style.height = Math.max(4, Math.round(jobFontSize * 0.3)) + "px";

  const jobTextEl = document.getElementById("preview-job-text");
  jobTextEl.textContent = jobVal;

  const jobEl = document.getElementById("preview-job");
  jobEl.style.color      = jobColor;
  jobEl.style.fontFamily = `"${fontVal}", sans-serif`;
  jobEl.style.fontSize   = jobFontSize + "px";
}

/* 起動時：URLパラメータ ?id= を markerId に反映し、
   Firestore の既存データを全フォームへ読み込む */
async function loadExistingData(markerId) {
  try {
    const snap = await getDoc(doc(db, "arUsers", markerId));
    if (!snap.exists()) return;
    const data = snap.data();

    document.getElementById("mindUrlInput").value  = data.mindUrl    ?? "";
    document.getElementById("nameInput").value      = data.name       ?? document.getElementById("nameInput").value;
    document.getElementById("jobInput").value        = data.job        ?? document.getElementById("jobInput").value;
    document.getElementById("fontSelect").value       = data.font       ?? document.getElementById("fontSelect").value;
    document.getElementById("nameColorInput").value    = data.nameColor  ?? document.getElementById("nameColorInput").value;
    document.getElementById("jobColorInput").value      = data.jobColor   ?? document.getElementById("jobColorInput").value;
    document.getElementById("accentColorInput").value    = data.accentColor ?? document.getElementById("accentColorInput").value;
    document.getElementById("fontSizeInput").value        = data.fontSize  ?? document.getElementById("fontSizeInput").value;

    const effect = data.effect && typeof data.effect === "object" ? data.effect : null;
    const effectTemplateId = effect?.templateId || "none";
    const effectSelect = document.getElementById("effectTemplateSelect");
    if (effectSelect) {
      effectSelect.value = Object.prototype.hasOwnProperty.call(FX_TEMPLATES, effectTemplateId) ? effectTemplateId : "none";
    }
    const effectColorInput = document.getElementById("effectColorInput");
    if (effectColorInput) {
      effectColorInput.value = effect?.color || FX_TEMPLATES[effectTemplateId]?.color || "#FFFFFF";
    }

    document.getElementById("instagramInput").value        = data.instagram ?? "";
    document.getElementById("xInput").value                  = data.x         ?? "";
    document.getElementById("HPInput").value                  = data.hp        ?? "";
    document.getElementById("lineInput").value                 = data.line      ?? "";

    if (Array.isArray(data.images) && data.images.length > 0) {
      imagesBase64 = data.images;
      imageRatios  = data.ratios || [];
      document.getElementById("fileList").innerText = imagesBase64.length + "枚（保存済み）";
    }

    updateDisplayValue("fontSizeInput");
  } catch (e) {
    console.error("既存データの読み込みに失敗しました:", e);
  }
}

/* ── ログイン ──
   editor.html はログイン済みの管理者だけが使える。
   Firestore 側も arUsers への書き込みは request.auth != null 必須にする想定。 */
const loginScreen = document.getElementById("login-screen");
const appWrapper   = document.getElementById("app-wrapper");

async function doLogin() {
  const email    = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errEl    = document.getElementById("loginError");
  const btn      = document.getElementById("loginBtn");

  errEl.textContent = "";
  btn.disabled = true;
  btn.innerText = "ログイン中...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    errEl.textContent = "ログインに失敗しました。メールアドレスかパスワードをご確認ください。";
    console.error("❌ ログインエラー:", e);
  }

  btn.disabled = false;
  btn.innerText = "ログイン";
}

document.getElementById("loginBtn").onclick = doLogin;
document.getElementById("loginPassword").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doLogin();
});

document.getElementById("logoutBtn").onclick = () => signOut(auth);

async function bootEditor() {
  const params = new URLSearchParams(window.location.search);
  const idParam = params.get("id");
  if (idParam) document.getElementById("markerId").value = idParam;

  await loadFxTemplates();
  await loadExistingData(document.getElementById("markerId").value);
  updatePreview();
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    loginScreen.style.display = "none";
    appWrapper.style.display  = "flex";
    await bootEditor();
  } else {
    loginScreen.style.display = "flex";
    appWrapper.style.display  = "none";
  }
});

document.getElementById("saveBtn").onclick = async() => {

  const markerId = document.getElementById("markerId").value;

  const saveBtn = document.getElementById("saveBtn");

  saveBtn.disabled = true;
  saveBtn.innerText = "保存中...";

  try{

    const payload = {

      name: document.getElementById("nameInput").value,
      job: document.getElementById("jobInput").value,

      font: document.getElementById("fontSelect").value,
      fontSize: parseInt(document.getElementById("fontSizeInput").value),
      nameColor: document.getElementById("nameColorInput").value,
      jobColor: document.getElementById("jobColorInput").value,
      accentColor: document.getElementById("accentColorInput").value,

      mindUrl: document.getElementById("mindUrlInput").value,

      effect: {
        templateId: document.getElementById("effectTemplateSelect").value,
        color: document.getElementById("effectColorInput").value
      },

      instagram: document.getElementById("instagramInput")?.value || "",
      x: document.getElementById("xInput")?.value || "",
      hp: document.getElementById("HPInput")?.value || "",
      line: document.getElementById("lineInput")?.value || ""

    };

    // 写真を選び直した時だけ images/ratios を送信する（既存写真を消さない）
    if (photosChanged) {
      payload.images = imagesBase64;
      payload.ratios = imageRatios;
    }

    await setDoc(doc(db, "arUsers", markerId), payload, { merge: true });

    alert("✓ 保存完了しました");
    console.log("💾 Firestore 保存完了");

  }catch(e){

    alert("✗ エラー：" + e.message);
    console.error("❌ 保存エラー:", e);

  }

  saveBtn.disabled = false;
  saveBtn.innerText = "FIRESTOREへ保存";

};

</script>

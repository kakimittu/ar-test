<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AR EDITOR</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500&family=Playfair+Display:wght@700&family=Caveat:wght@700&family=Aloha:wght@400&display=swap" rel="stylesheet">

<style>
@font-face{
  font-family:'CorporateMincho';
  src:url('./assets/fonts/Corporate-Mincho-ver3.woff2') format('woff2'),
      url('./assets/fonts/Corporate-Mincho-ver3.woff2') format('woff');
  font-display: swap;
  font-weight: normal;
  font-style: normal;
}

body {
  margin: 0;
  font-family: 'Noto Sans JP', 'Roboto', sans-serif;
  background: #09090b;
  color: #f4f4f5;
  overflow: hidden;
  height: 100vh;
}

#app-wrapper {
  display: flex;
  height: 100vh;
}

#controls {
  flex: 0 0 480px;
  padding: 24px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 24px;
  overflow-y: auto;
  height: 100vh;
}

/* スクロールバーのカスタマイズ */
#controls::-webkit-scrollbar {
  width: 6px;
}
#controls::-webkit-scrollbar-thumb {
  background: #27272a;
  border-radius: 3px;
}

/* タイトルスタイル */
h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #06b6d4; /* 高級感のあるアクア */
  border-bottom: 1px solid #27272a;
  padding-bottom: 16px;
}

/* セクション（カード）ごとのまとまり */
.section-box {
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #71717a;
  margin-bottom: 4px;
  font-weight: 700;
}

/* 入力グループ */
.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

label {
  font-size: 12px;
  font-weight: 500;
  color: #a1a1aa;
}

/* フォーム要素の共通モダンデザイン */
input[type="text"], select, input[type="color"], input[type="range"] {
  width: 100%;
  padding: 10px 12px;
  background: #202024;
  border: 1px solid #3f3f46;
  color: #fff;
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 13px;
  transition: all 0.2s ease;
}

input[type="range"] {
  padding: 0;
  height: 6px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #06b6d4;
  cursor: pointer;
  transition: all 0.2s ease;
}

input[type="range"]::-webkit-slider-thumb:hover {
  background: #22d3ee;
  transform: scale(1.2);
}

input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #06b6d4;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

input[type="range"]::-moz-range-thumb:hover {
  background: #22d3ee;
  transform: scale(1.2);
}

input[type="text"]:focus, select:focus, input[type="color"]:focus {
  outline: none;
  border-color: #06b6d4;
  box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.15);
}

input[type="color"] {
  height: 44px;
  cursor: pointer;
}

input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 2px;
}

input[type="color"]::-webkit-color-swatch {
  border: none;
  border-radius: 4px;
}

/* ファイル入力のカスタム */
.file-input-wrapper {
  position: relative;
  display: inline-block;
  width: 100%;
}

input[type="file"] {
  width: 100%;
  padding: 8px;
  background: #202024;
  border: 1px dashed #3f3f46;
  color: #a1a1aa;
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 12px;
  cursor: pointer;
}

input[type="file"]:hover {
  border-color: #06b6d4;
}

#fileList {
  margin-top: 4px;
  font-size: 11px;
  color: #71717a;
  text-align: right;
}

#saveMessage {
  display: none;
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}

#saveMessage.warning {
  color: #fbbf24;
}

#saveMessage.error {
  color: #fb7185;
}

#saveMessage.success {
  color: #67e8f9;
}

select {
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 16px;
  padding-right: 40px;
}

select option {
  background: #202024;
  color: #fff;
}

/* 保存ボタン */
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  font-size: 14px;
  letter-spacing: 0.05em;
  cursor: pointer;
  margin-top: 10px;
  background: #06b6d4;
  color: #09090b;
  transition: all 0.2s ease;
}

.btn:hover {
  background: #22d3ee;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  background: #27272a;
  color: #71717a;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ── プレビューパネル ── */
#preview-panel {
  flex: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0d0d0f;
  border-left: 1px solid #27272a;
  padding: 24px;
  box-sizing: border-box;
  overflow: hidden;
}

.preview-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #71717a;
  margin-bottom: 16px;
  font-weight: 700;
}

.phone-frame {
  width: 260px;
  height: 528px;
  background: #1c1c1e;
  border: 6px solid #3a3a3c;
  border-radius: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 8px 10px;
  box-sizing: border-box;
  box-shadow: 0 0 0 2px #555, 0 20px 60px rgba(0,0,0,0.8), inset 0 0 0 1px #2a2a2a;
  position: relative;
}

.phone-notch {
  width: 70px;
  height: 10px;
  background: #111;
  border-radius: 5px;
  margin-bottom: 10px;
  flex-shrink: 0;
}

.phone-screen {
  width: 100%;
  flex: 1;
  background: #050508;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

.phone-home {
  width: 80px;
  height: 4px;
  background: #444;
  border-radius: 2px;
  margin-top: 10px;
  flex-shrink: 0;
}

#preview-camera-bg {
  width: 100%;
  height: 100%;
  background: #080810;
  position: relative;
  overflow: hidden;
}

#preview-camera-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(rgba(0,242,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,242,255,0.025) 1px, transparent 1px);
  background-size: 18px 18px;
  pointer-events: none;
  z-index: 1;
}

#preview-photo {
  position: absolute;
  object-fit: cover;
  display: none;
  z-index: 2;
}

#preview-effect-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  z-index: 3;
  pointer-events: none;
}

/* 写真上部に落ちる、名札が浮いていることを示す影 */
#preview-shadow {
  position: absolute;
  z-index: 4;
  display: none;
  pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.5), transparent 72%);
  filter: blur(2px);
}

/* 写真の上に浮く名札（index.html の plateGroup と同じ考え方） */
#preview-plate-anchor {
  position: absolute;
  z-index: 5;
  display: none;
  pointer-events: none;
}

.preview-plate-center {
  transform: translate(-50%, -100%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.preview-plate-bob {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding-bottom: 6px;
  animation: previewBob 2.2s ease-in-out infinite;
}

@keyframes previewBob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

#preview-name {
  font-weight: bold;
  white-space: nowrap;
  text-align: center;
  text-shadow: 0 0 10px rgba(0,0,0,0.6);
}

#preview-job {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  white-space: nowrap;
  text-shadow: 0 0 10px rgba(0,0,0,0.6);
}

#preview-job-dot {
  flex-shrink: 0;
}

.scan-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,242,255,0.5), transparent);
  z-index: 10;
  animation: scan 3s linear infinite;
  pointer-events: none;
}

@keyframes scan {
  0%   { top: 0;    opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

.hud-corner {
  position: absolute;
  width: 14px;
  height: 14px;
  z-index: 10;
  pointer-events: none;
}
.hud-corner.tl { top: 6px;    left: 6px;  border-top: 2px solid rgba(0,242,255,0.8); border-left: 2px solid rgba(0,242,255,0.8); }
.hud-corner.tr { top: 6px;    right: 6px; border-top: 2px solid rgba(0,242,255,0.8); border-right: 2px solid rgba(0,242,255,0.8); }
.hud-corner.bl { bottom: 6px; left: 6px;  border-bottom: 2px solid rgba(0,242,255,0.8); border-left: 2px solid rgba(0,242,255,0.8); }
.hud-corner.br { bottom: 6px; right: 6px; border-bottom: 2px solid rgba(0,242,255,0.8); border-right: 2px solid rgba(0,242,255,0.8); }

.preview-hint {
  margin-top: 14px;
  font-size: 11px;
  color: #52525b;
  text-align: center;
  line-height: 1.7;
}

/* ── ログイン画面 ── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.login-card {
  width: 320px;
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 8px;
  padding: 28px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.login-card h2 {
  border-bottom: none;
  padding-bottom: 0;
  margin-bottom: 4px;
}

#loginError {
  color: #f87171;
  font-size: 12px;
  min-height: 16px;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #27272a;
  padding-bottom: 16px;
}
.header-row h2 { border-bottom: none; padding-bottom: 0; }

#logoutBtn {
  background: transparent;
  border: 1px solid #3f3f46;
  color: #a1a1aa;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
}
#logoutBtn:hover { border-color: #06b6d4; color: #06b6d4; }

/* ── ドキュメントID行（ランダム生成ボタン付き） ── */
.id-row {
  display: flex;
  gap: 8px;
}
.id-row input { flex: 1; }
.id-row button {
  flex-shrink: 0;
  padding: 0 12px;
  background: #202024;
  border: 1px solid #3f3f46;
  color: #d4d4d8;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.id-row button:hover { border-color: #06b6d4; color: #06b6d4; }

@media (max-width: 900px) {
  body { overflow-y: auto; overflow-x: hidden; height: auto; }
  #app-wrapper { flex-direction: column; height: auto; }
  #controls { flex: none; width: 100%; height: auto; overflow-y: visible; }
  #preview-panel { height: 640px; border-left: none; border-top: 1px solid #27272a; flex: none; width: 100%; }
}

</style>
</head>

<body>

<div id="login-screen">
  <div class="login-card">
    <h2>AR EDITOR</h2>
    <div class="input-group">
      <label>メールアドレス</label>
      <input type="text" id="loginEmail" autocomplete="username">
    </div>
    <div class="input-group">
      <label>パスワード</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button id="loginBtn" type="button" class="btn">ログイン</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="app-wrapper" style="display:none;">

<div id="controls">

  <div class="header-row">
    <h2>AR EDITOR</h2>
    <button id="logoutBtn" type="button">ログアウト</button>
  </div>

<div class="section-box">
    <div class="section-title">System Settings</div>
    <div class="input-group">
      <label>ドキュメントID</label>
      <div class="id-row">
        <input type="text" id="markerId" value="akazawa">
        <button type="button" id="generateIdBtn">ランダム生成</button>
      </div>
    </div>

    <div class="input-group">
      <label>MindARターゲットURL (.mind)</label>
      <input type="text" id="mindUrlInput" placeholder="assets/targets/pattern-AKA2.mind">
    </div>
  </div>

  <div class="section-box">
    <div class="section-title">Profile Content</div>
    <div class="input-group">
      <label>お名前</label>
      <input type="text" id="nameInput" value="赤澤 優子">
    </div>

    <div class="input-group">
      <label>肩書き</label>
      <input type="text" id="jobInput" value="ホーストレーナー">
    </div>

    <div class="input-group">
      <label>フォント</label>
      <select id="fontSelect">
        <option value="CorporateMincho">Corporate Mincho</option>
        <option value="Noto Sans JP">Noto Sans JP</option>
        <option value="Roboto">Roboto</option>
        <option value="Playfair Display">Playfair Display</option>
        <option value="Caveat">Caveat</option>
        <option value="Aloha">Aloha</option>
      </select>
    </div>

    <div class="input-group">
      <label>お名前の色</label>
      <input type="color" id="nameColorInput" value="#ffffff">
    </div>

    <div class="input-group">
      <label>肩書きの色</label>
      <input type="color" id="jobColorInput" value="#ffcc00">
    </div>

    <div class="input-group">
      <label>アクセントカラー</label>
      <input type="color" id="accentColorInput" value="#D99A3E">
    </div>

    <div class="input-group">
      <label>文字サイズ</label>
      <input type="range" id="fontSizeInput" min="40" max="150" value="80" step="5">
      <div style="font-size: 11px; color: #71717a; text-align: right;" id="fontSizeDisplay">80px</div>
    </div>

    <div class="input-group">
      <label>画像</label>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div id="fileList">未選択</div>
    </div>
  </div>

  <div class="section-box">
    <div class="section-title">Effect</div>
    <div class="input-group">
      <label>エフェクト</label>
      <select id="effectTemplateSelect"></select>
    </div>
    <div class="input-group">
      <label>エフェクトの色</label>
      <input type="color" id="effectColorInput" value="#FFD44D">
    </div>
  </div>

  <div class="section-box">
    <div class="section-title">Social Links</div>
    <div class="input-group">
      <label>Instagram URL</label>
      <input type="text" id="instagramInput" placeholder="https://instagram.com/username">
    </div>

    <div class="input-group">
      <label>X URL</label>
      <input type="text" id="xInput" placeholder="https://x.com/username">
    </div>

    <div class="input-group">
      <label>HP URL</label>
      <input type="text" id="HPInput" placeholder="https://example.com">
    </div>

    <div class="input-group">
      <label>LINE URL</label>
      <input type="text" id="lineInput" placeholder="https://line.me/R/ti/p/...">
    </div>
  </div>

  <button id="saveBtn" class="btn">FIRESTOREへ保存</button>
  <div id="saveMessage" role="status"></div>

</div>

<!-- スマホプレビューパネル -->
<div id="preview-panel">
  <div class="preview-label">スマホプレビュー</div>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div id="preview-camera-bg">
        <div class="scan-line"></div>
        <div class="hud-corner tl"></div>
        <div class="hud-corner tr"></div>
        <div class="hud-corner bl"></div>
        <div class="hud-corner br"></div>
        <img id="preview-photo" src="" alt="">
        <canvas id="preview-effect-canvas" aria-hidden="true"></canvas>
        <div id="preview-shadow"></div>
        <div id="preview-plate-anchor">
          <div class="preview-plate-center">
            <div class="preview-plate-bob">
              <div id="preview-name">名前</div>
              <div id="preview-job"><span id="preview-job-dot"></span><span id="preview-job-text">肩書き</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="phone-home"></div>
  </div>
  <div class="preview-hint">index.html と同じ、写真の上にゆらゆら浮かぶ<br>名札レイアウトのプレビューです</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

const FIRESTORE_DOCUMENT_LIMIT=1048576;

/* ============================================================
   FXエンジン v2

   v1との一番の違い：
   v1は「花びらが数枚まとめて描かれた1枚の絵」を動かしていた。
   v2は 飾り1粒 = 1エンティティ。位置・大きさ・速さ・向き・
   開始タイミング・色を、粒ごとに別々の乱数で決める。

   乱数はカードIDから作る固定シードなので、
   同じカードは何度開いても同じ並びになる（毎回変わると安っぽい）。
   ============================================================ */

/* ---------- 固定シード乱数 ---------- */
function fxRng(seed){
  let s = 0;
  const str = String(seed == null ? 'fx' : seed);
  for (let i = 0; i < str.length; i++) s = (s * 31 + str.charCodeAt(i)) >>> 0;
  if (!s) s = 0x9e3779b9;
  return function(){
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
const fxRange = (r, a, b) => a + (b - a) * r();

/* ---------- 色のゆらぎ（粒ごとに少しずつ色を変える） ---------- */
function fxHexToHsl(hex){
  let h = hex.replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const R = parseInt(h.slice(0,2),16)/255,
        G = parseInt(h.slice(2,4),16)/255,
        B = parseInt(h.slice(4,6),16)/255;
  const mx = Math.max(R,G,B), mn = Math.min(R,G,B), l = (mx+mn)/2;
  let s = 0, hu = 0;
  if (mx !== mn){
    const dd = mx - mn;
    s = l > .5 ? dd/(2-mx-mn) : dd/(mx+mn);
    if (mx === R) hu = ((G-B)/dd + (G < B ? 6 : 0));
    else if (mx === G) hu = (B-R)/dd + 2;
    else hu = (R-G)/dd + 4;
    hu *= 60;
  }
  return [hu, s, l];
}
function fxHslToHex(hu, s, l){
  hu = ((hu % 360) + 360) % 360;
  s = Math.min(1, Math.max(0, s));
  l = Math.min(1, Math.max(0, l));
  const c = (1 - Math.abs(2*l - 1)) * s,
        x = c * (1 - Math.abs((hu/60) % 2 - 1)),
        m = l - c/2;
  let r1, g1, b1;
  if (hu < 60)       [r1,g1,b1] = [c,x,0];
  else if (hu < 120) [r1,g1,b1] = [x,c,0];
  else if (hu < 180) [r1,g1,b1] = [0,c,x];
  else if (hu < 240) [r1,g1,b1] = [0,x,c];
  else if (hu < 300) [r1,g1,b1] = [x,0,c];
  else               [r1,g1,b1] = [c,0,x];
  const to = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#' + to(r1) + to(g1) + to(b1);
}
function fxVary(hex, dHue, dLight){
  if (!dHue && !dLight) return hex;
  const [h,s,l] = fxHexToHsl(hex);
  return fxHslToHex(h + (dHue||0), s, l + (dLight||0));
}

/* ---------- 粒をどこに置くか ---------- */
function fxSpawn(r, area, at){
  if (at) return { x: at[0], y: at[1] };       // 位置を直接指定したいとき
  switch (area){
    case 'ring': {                       // カードの外周。中央の写真を避ける
      const a = r() * Math.PI * 2;
      const rad = fxRange(r, .44, .66);
      return { x: Math.cos(a) * rad * 1.3, y: Math.sin(a) * rad };
    }
    case 'top':    return { x: fxRange(r,-.80,.80), y: fxRange(r, .42, .78) };
    case 'bottom': return { x: fxRange(r,-.80,.80), y: fxRange(r,-.78,-.42) };
    case 'center': return { x: fxRange(r,-.22,.22), y: fxRange(r,-.18,.18) };
    case 'edge':   return { x: (r()<.5?-1:1) * fxRange(r,.52,.78), y: fxRange(r,-.5,.5) };
    default:       return { x: fxRange(r,-.82,.82), y: fxRange(r,-.62,.62) };
  }
}

/* ---------- 動き ---------- */
/* p = {x,y,z,size,dur,delay,dir,op} */
function fxMotion(el, motion, p, r){
  const A  = (name, val) => el.setAttribute(name, val);
  const to = (x,y,z) => `${x.toFixed(3)} ${y.toFixed(3)} ${z.toFixed(3)}`;

  switch (motion){

    case 'twinkle':                                   // その場で明滅
      A('animation',
        `property: material.opacity; from: ${p.op}; to: ${(p.op*0.08).toFixed(3)};` +
        ` dir: alternate; loop: true; dur: ${p.dur}; easing: easeInOutQuad; delay: ${p.delay}`);
      A('animation__s',
        `property: scale; from: 1 1 1; to: .5 .5 1;` +
        ` dir: alternate; loop: true; dur: ${p.dur}; easing: easeInOutQuad; delay: ${p.delay}`);
      break;

    case 'float':                                     // ゆっくり上下
      A('animation',
        `property: position; to: ${to(p.x, p.y + fxRange(r,.05,.12), p.z)};` +
        ` dir: alternate; loop: true; dur: ${p.dur}; easing: easeInOutSine; delay: ${p.delay}`);
      break;

    case 'spin':                                      // その場で回転
      A('animation',
        `property: rotation; to: 0 0 ${360*p.dir}; loop: true; dur: ${p.dur}; easing: linear; delay: ${p.delay}`);
      break;

    case 'pulse':                                     // 拡大縮小
      A('animation',
        `property: scale; from: .86 .86 1; to: 1.16 1.16 1;` +
        ` dir: alternate; loop: true; dur: ${p.dur}; easing: easeInOutSine; delay: ${p.delay}`);
      break;

    case 'fall': {                                    // 上から舞い落ちる
      const drift = fxRange(r,-.30,.30);
      A('animation',
        `property: position; from: ${to(p.x,p.y,p.z)}; to: ${to(p.x+drift, p.y-1.45, p.z)};` +
        ` loop: true; dur: ${p.dur}; easing: linear; delay: ${p.delay}`);
      A('animation__r',
        `property: rotation; to: 0 0 ${Math.round(fxRange(r,150,420))*p.dir};` +
        ` loop: true; dur: ${Math.round(p.dur*fxRange(r,.6,1.1))}; easing: linear; delay: ${p.delay}`);
      A('animation__f',                               // 出はじめだけふわっと
        `property: material.opacity; from: 0; to: ${p.op};` +
        ` dur: ${Math.round(p.dur*0.22)}; easing: easeOutQuad; delay: ${p.delay}`);
      break;
    }

    case 'rise': {                                    // 下から舞い上がる
      const drift = fxRange(r,-.26,.26);
      A('animation',
        `property: position; from: ${to(p.x,p.y,p.z)}; to: ${to(p.x+drift, p.y+1.45, p.z)};` +
        ` loop: true; dur: ${p.dur}; easing: linear; delay: ${p.delay}`);
      A('animation__r',
        `property: rotation; to: 0 0 ${Math.round(fxRange(r,60,220))*p.dir};` +
        ` dir: alternate; loop: true; dur: ${Math.round(p.dur*.5)}; easing: easeInOutSine; delay: ${p.delay}`);
      A('animation__f',
        `property: material.opacity; from: 0; to: ${p.op};` +
        ` dur: ${Math.round(p.dur*0.25)}; easing: easeOutQuad; delay: ${p.delay}`);
      break;
    }

    case 'drift':                                     // ふらふら漂う
      A('animation',
        `property: position; to: ${to(p.x + fxRange(r,-.3,.3)*p.dir, p.y + fxRange(r,-.25,.25), p.z)};` +
        ` dir: alternate; loop: true; dur: ${p.dur}; easing: easeInOutSine; delay: ${p.delay}`);
      break;

    case 'firefly':                                   // 漂いながら明滅（蛍）
      A('animation',
        `property: position; to: ${to(p.x + fxRange(r,-.34,.34)*p.dir, p.y + fxRange(r,-.3,.3), p.z)};` +
        ` dir: alternate; loop: true; dur: ${p.dur}; easing: easeInOutSine; delay: ${p.delay}`);
      A('animation__o',
        `property: material.opacity; from: ${(p.op*0.1).toFixed(3)}; to: ${p.op};` +
        ` dir: alternate; loop: true; dur: ${Math.round(p.dur*fxRange(r,.28,.5))};` +
        ` easing: easeInOutQuad; delay: ${Math.round(r()*1200)}`);
      break;

    default:
      A('animation',
        `property: rotation; to: 0 0 ${360*p.dir}; loop: true; dur: ${p.dur}; easing: linear; delay: ${p.delay}`);
  }
}

/* ---------- 組み立て ---------- */
/* container : 飾りを入れる a-entity
   tpl       : FX_TEMPLATES のどれか
   color     : 上書きする色（null ならテンプレートの既定色）
   seed      : カードIDなど。同じなら毎回同じ並びになる
   density   : 粒の量の倍率（1 が標準）                         */
function buildFx(container, tpl, color, seed, density){
  while (container.firstChild) container.removeChild(container.firstChild);
  if (!tpl || !tpl.layers) return 0;

  const r    = fxRng(seed == null ? tpl.label : seed);
  const base = color || tpl.color;
  const dens = (density == null ? 1 : density);
  let made = 0;

  tpl.layers.forEach((L, li) => {
    const n = Math.max(1, Math.round((L.n || 6) * dens));

    for (let i = 0; i < n; i++){
      const pos   = fxSpawn(r, L.area || 'all', L.at);
      const size  = fxRange(r, L.size[0], L.size[1]);
      const dur   = Math.round(fxRange(r, L.dur[0], L.dur[1]));
      const opRng = L.op || [0.85, 1];
      const p = {
        x: pos.x, y: pos.y,
        z: 0.03 + li * 0.004 + i * 0.0004,   // 粒ごとに奥行きをずらす（重なりのチラつき防止）
        size, dur,
        delay: Math.round(r() * dur),        // ← 開始タイミングを粒ごとにバラす
        dir:   r() < 0.5 ? 1 : -1,
        op:    +fxRange(r, opRng[0], opRng[1]).toFixed(3)
      };

      const col = fxVary(base,
        L.hue   ? (r()*2-1) * L.hue   : 0,
        L.light ? (r()*2-1) * L.light : 0);

      const el = document.createElement('a-entity');
      el.setAttribute('geometry', { primitive:'plane', width:size, height:size });
      el.setAttribute('material', {
        shader:'flat', src:'#fx_' + L.src,
        transparent:true, alphaTest:0,
        depthWrite:false,                    // 透明な板どうしの打ち消し合いを防ぐ
        color:col,
        /* 舞い落ち・舞い上がりは、出番が来るまで見えないようにしておく。
           そうしないと開始前の粒が上端に固まって見える */
        opacity: (L.motion === 'fall' || L.motion === 'rise') ? 0 : p.op,
        side:'double'
      });
      el.setAttribute('position', { x:p.x, y:p.y, z:p.z });

      fxMotion(el, L.motion, p, r);
      container.appendChild(el);
      made++;
    }
  });
  return made;
}


/* ============================================================
   エディタのプレビュー用 2D描画

   以前はここに ✦ という文字を4つ置いてCSSで点滅させていたが、
   それだとARの実物とまったく別物で、テンプレートを変えても
   同じような点滅にしか見えなかった。

   いまは AR と同じスプライト画像・同じテンプレート定義・
   同じ乱数を使って、canvas に1粒ずつ描いている。
   ============================================================ */
const fxPreview = (function(){

  let canvas = null, ctx = null, raf = null, t0 = 0;
  let particles = [];
  const imgs = {};
  const tintCache = {};

  Object.entries(SPRITE_DATA).forEach(([name, uri]) => {
    const im = new Image();
    im.src = uri;
    imgs[name] = im;
  });

  /* 白いシルエットに色を付けて使い回す */
  function tinted(name, color){
    const key = name + '|' + color;
    if (tintCache[key]) return tintCache[key];
    const src = imgs[name];
    if (!src || !src.naturalWidth) return null;
    const c = document.createElement('canvas');
    c.width = src.naturalWidth; c.height = src.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, c.width, c.height);
    tintCache[key] = c;
    return c;
  }

  function build(tplId, color){
    canvas = document.getElementById('preview-effect-canvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');

    particles = [];
    const tpl = FX_TEMPLATES[tplId];
    if (!tpl || !tpl.layers){ stop(); clear(); return; }

    const r = fxRng(tplId);
    const base = color || tpl.color;

    tpl.layers.forEach(L => {
      const n = L.n || 6;
      for (let i = 0; i < n; i++){
        const pos = fxSpawn(r, L.area || 'all', L.at);
        const opR = L.op || [0.85, 1];
        particles.push({
          src:    L.src,
          motion: L.motion,
          x: pos.x, y: pos.y,
          size:  fxRange(r, L.size[0], L.size[1]),
          dur:   fxRange(r, L.dur[0], L.dur[1]),
          phase: r(),
          dir:   r() < .5 ? 1 : -1,
          op:    fxRange(r, opR[0], opR[1]),
          drift: fxRange(r, -.3, .3),
          wob:   fxRange(r, .05, .12),
          color: fxVary(base,
                   L.hue   ? (r()*2-1) * L.hue   : 0,
                   L.light ? (r()*2-1) * L.light : 0)
        });
      }
    });
    start();
  }

  function clear(){
    if (canvas && ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function resize(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.max(1, Math.round(rect.width  * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
  }

  function frame(now){
    if (!t0) t0 = now;
    const t = now - t0;
    resize();
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const cx = W / 2, cy = H / 2;
    const unit = W * 0.55;          // ARのカード幅1に対応する画面上の長さ

    for (const p of particles){
      let x = p.x, y = p.y, rot = 0, scale = 1, op = p.op;
      const cyc = (t / p.dur) + p.phase;
      const wave = 0.5 + 0.5 * Math.cos(cyc * Math.PI * 2);
      const prog = cyc - Math.floor(cyc);

      switch (p.motion){
        case 'twinkle':
          op *= 0.08 + 0.92 * wave;
          scale = 0.5 + 0.5 * wave;
          break;
        case 'float':
          y += p.wob * wave;
          break;
        case 'spin':
          rot = cyc * Math.PI * 2 * p.dir;
          break;
        case 'pulse':
          scale = 0.86 + 0.30 * wave;
          break;
        case 'fall':
          y = p.y - 1.45 * prog;
          x = p.x + p.drift * prog;
          rot = prog * Math.PI * 2 * p.dir;
          if (prog < 0.22) op *= prog / 0.22;
          break;
        case 'rise':
          y = p.y + 1.45 * prog;
          x = p.x + p.drift * prog;
          rot = Math.sin(prog * Math.PI * 2) * 0.5 * p.dir;
          if (prog < 0.25) op *= prog / 0.25;
          break;
        case 'drift':
          x += p.drift * p.dir * wave;
          y += p.wob * 2 * wave;
          break;
        case 'firefly':
          x += p.drift * p.dir * wave;
          y += p.wob * 2 * wave;
          op *= 0.1 + 0.9 * (0.5 + 0.5 * Math.cos(cyc * Math.PI * 5.2));
          break;
        default:
          rot = cyc * Math.PI * 2 * p.dir;
      }

      const tex = tinted(p.src, p.color);
      if (!tex) continue;
      const sz = p.size * unit * scale;
      if (sz < 0.5) continue;

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, op));
      ctx.translate(cx + x * unit, cy - y * unit);
      ctx.rotate(rot);
      ctx.drawImage(tex, -sz/2, -sz/2, sz, sz);
      ctx.restore();
    }
    raf = requestAnimationFrame(frame);
  }

  function start(){ if (!raf) raf = requestAnimationFrame(frame); }
  function stop(){ if (raf){ cancelAnimationFrame(raf); raf = null; } }

  return { build, stop, clear };
})();


function populateFxTemplateSelect() {
  const select = document.getElementById("effectTemplateSelect");
  if (!select) return;
  select.innerHTML = "";
  Object.entries(FX_TEMPLATES).forEach(([key, tpl]) => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = tpl.label || key;
    select.appendChild(option);
  });
}

/* loadFxTemplates は廃止。定義は上に直接書いてある */

  const select = document.getElementById("effectTemplateSelect");
  const colorInput = document.getElementById("effectColorInput");
  if (!select || !colorInput) return;
  const selected = select.value;
  const tpl = FX_TEMPLATES[selected] || FX_TEMPLATES.none;
  colorInput.value = tpl.color || "#FFFFFF";
  updatePreview();
}

document.getElementById("effectTemplateSelect")?.addEventListener("change", syncEffectColorFromTemplate);
document.getElementById("effectColorInput")?.addEventListener("input", updatePreview);

document.getElementById("fileInput").onchange=async(e)=>{

const files=[...e.target.files];
if(files.length===0) return;

photosChanged=true;
imagesBase64=[];
imageRatios=[];

document.getElementById("fileList").innerText=files.length+"枚選択";

for(const file of files){

const result=await processImage(file);

imagesBase64.push(result.data);
imageRatios.push(result.ratio);

}

updatePreview();

};

/* ドキュメントIDのランダム生成（推測されにくいIDで新規顧客を作成） */
function generateRandomId(len = 8) {
  const chars = "abcdefghijkmnpqrstuvwxyz23456789"; // 紛らわしい文字(0,1,l,i,o)は除外
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let id = "";
  for (let i = 0; i < len; i++) id += chars[arr[i] % chars.length];
  return id;
}

function updateDisplayValue(id) {
  const el = document.getElementById(id);
  const displayId = id.replace(/Input$/, "") + "Display";
  const displayEl = document.getElementById(displayId);
  if (displayEl) {
    if (id === "fontSizeInput") {
      displayEl.textContent = el.value + "px";
    } else {
      displayEl.textContent = el.value;
    }
  }
}

// テキスト・色・フォント変更でもプレビューを更新
["nameInput","jobInput","fontSelect","nameColorInput","jobColorInput","accentColorInput"].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener("input", updatePreview);
  if(el) el.addEventListener("change", updatePreview);
});

function processImage(file){

return new Promise(resolve=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const canvas=document.createElement("canvas");

const maxW=800;
const ratio=img.height/img.width;

canvas.width=maxW;
canvas.height=maxW*ratio;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,canvas.width,canvas.height);

resolve({
data:canvas.toDataURL("image/jpeg",0.7),
ratio:ratio
});

};

function getUtf8ByteLength(value){
  return new TextEncoder().encode(value).length;
}

function formatBytes(bytes){
  return `${(bytes/1024).toFixed(1)}KB`;
}

function showSaveMessage(message,type){
  const el=document.getElementById("saveMessage");
  el.textContent=message;
  el.className=type;
  el.style.display="block";
}

function isFirestoreSizeError(error){
  const message=String(error?.message||error||"").toLowerCase();
  return error?.code==="resource-exhausted"
    || message.includes("1 mib")
    || message.includes("maximum allowed size")
    || message.includes("too large")
    || message.includes("document size");
}

img.src=e.target.result;

};

reader.readAsDataURL(file);

});

}

/* ── CSS ベースのリアルタイムプレビュー ──
   index.html の実レイアウト（写真は無加工のまま、上に浮く名札＋影）に合わせる */
function updatePreview() {
  const screen = document.getElementById("preview-camera-bg");
  if (!screen) return;

  const screenW = screen.offsetWidth || 244;
  const screenH = screen.offsetHeight || 462;

  const nameVal     = document.getElementById("nameInput").value || "名前";
  const jobVal      = document.getElementById("jobInput").value  || "肩書き";
  const fontVal     = document.getElementById("fontSelect").value;
  const fontSizeVal = parseInt(document.getElementById("fontSizeInput").value) || 80;
  const nameColor   = document.getElementById("nameColorInput").value;
  const jobColor    = document.getElementById("jobColorInput").value;
  const accentColor = document.getElementById("accentColorInput").value;
  const effectTemplate = document.getElementById("effectTemplateSelect")?.value || "none";
  const effectColor = document.getElementById("effectColorInput")?.value || "#FFD44D";

  const ratio  = imageRatios[0] || 1;
  const photoW = screenW * 0.86;
  const photoH = photoW * ratio;
  const left   = (screenW - photoW) / 2;

  // 名札＋影のぶん、写真の上に一定の余白を確保してから残りを中央寄せする
  const extraTop = photoW * 0.32;
  const top = extraTop + Math.max(0, (screenH - extraTop - photoH) / 2);

  const photoEl = document.getElementById("preview-photo");
  if (imagesBase64.length > 0) {
    photoEl.src = imagesBase64[0];
    photoEl.style.display = "block";
  } else {
    photoEl.style.display = "none";
  }
  photoEl.style.width  = photoW + "px";
  photoEl.style.height = photoH + "px";
  photoEl.style.left   = left + "px";
  photoEl.style.top    = top + "px";

  const effectCanvas = document.getElementById("preview-effect-canvas");
  if (effectCanvas) {
    if (effectTemplate === "none") {
      effectCanvas.style.display = "none";
      fxPreview.stop();
      fxPreview.clear();
    } else {
      effectCanvas.style.display = "block";
      /* ARと同じ素材・同じ粒数・同じ乱数で1粒ずつ描く */
      fxPreview.build(effectTemplate, effectColor);
    }
  }

  // 影：写真の上端近くに落とす
  const shadowEl = document.getElementById("preview-shadow");
  const shadowW  = photoW * 0.5;
  const shadowH  = Math.max(8, photoW * 0.045);
  shadowEl.style.display = imagesBase64.length > 0 ? "block" : "none";
  shadowEl.style.width  = shadowW + "px";
  shadowEl.style.height = shadowH + "px";
  shadowEl.style.left   = (left + photoW / 2 - shadowW / 2) + "px";
  shadowEl.style.top    = (top + photoH * 0.06) + "px";

  // 名札：写真の外側・上に浮かせる（index.html の plateGroup と同じ考え方）
  const gapPx = photoW * (0.20 / 1.3);
  const plateAnchorEl = document.getElementById("preview-plate-anchor");
  plateAnchorEl.style.display = "block";
  plateAnchorEl.style.left = (left + photoW / 2) + "px";
  plateAnchorEl.style.top  = (top - gapPx) + "px";

  const previewFontSize = Math.max(9, Math.round(fontSizeVal * 0.16));

  const nameEl = document.getElementById("preview-name");
  nameEl.textContent      = nameVal;
  nameEl.style.color      = nameColor;
  nameEl.style.fontFamily = `"${fontVal}", sans-serif`;
  nameEl.style.fontSize   = previewFontSize + "px";

  const jobFontSize = Math.round(previewFontSize * 0.78);

  const dotEl = document.getElementById("preview-job-dot");
  dotEl.style.background = accentColor;
  dotEl.style.width  = Math.max(4, Math.round(jobFontSize * 0.3)) + "px";
  dotEl.style.height = Math.max(4, Math.round(jobFontSize * 0.3)) + "px";

  const jobTextEl = document.getElementById("preview-job-text");
  jobTextEl.textContent = jobVal;

  const jobEl = document.getElementById("preview-job");
  jobEl.style.color      = jobColor;
  jobEl.style.fontFamily = `"${fontVal}", sans-serif`;
  jobEl.style.fontSize   = jobFontSize + "px";
}

/* 起動時：URLパラメータ ?id= を markerId に反映し、
   Firestore の既存データを全フォームへ読み込む */
async function loadExistingData(markerId) {
  try {
    const snap = await getDoc(doc(db, "arUsers", markerId));
    if (!snap.exists()) return;
    const data = snap.data();

    document.getElementById("mindUrlInput").value  = data.mindUrl    ?? "";
    document.getElementById("nameInput").value      = data.name       ?? document.getElementById("nameInput").value;
    document.getElementById("jobInput").value        = data.job        ?? document.getElementById("jobInput").value;
    document.getElementById("fontSelect").value       = data.font       ?? document.getElementById("fontSelect").value;
    document.getElementById("nameColorInput").value    = data.nameColor  ?? document.getElementById("nameColorInput").value;
    document.getElementById("jobColorInput").value      = data.jobColor   ?? document.getElementById("jobColorInput").value;
    document.getElementById("accentColorInput").value    = data.accentColor ?? document.getElementById("accentColorInput").value;
    document.getElementById("fontSizeInput").value        = data.fontSize  ?? document.getElementById("fontSizeInput").value;

    const effect = data.effect && typeof data.effect === "object" ? data.effect : null;
    const effectTemplateId = effect?.templateId || "none";
    const effectSelect = document.getElementById("effectTemplateSelect");
    if (effectSelect) {
      effectSelect.value = Object.prototype.hasOwnProperty.call(FX_TEMPLATES, effectTemplateId) ? effectTemplateId : "none";
    }
    const effectColorInput = document.getElementById("effectColorInput");
    if (effectColorInput) {
      effectColorInput.value = effect?.color || FX_TEMPLATES[effectTemplateId]?.color || "#FFFFFF";
    }

    document.getElementById("instagramInput").value        = data.instagram ?? "";
    document.getElementById("xInput").value                  = data.x         ?? "";
    document.getElementById("HPInput").value                  = data.hp        ?? "";
    document.getElementById("lineInput").value                 = data.line      ?? "";

    if (Array.isArray(data.images) && data.images.length > 0) {
      imagesBase64 = data.images;
      imageRatios  = data.ratios || [];
      document.getElementById("fileList").innerText = imagesBase64.length + "枚（保存済み）";
    }

    updateDisplayValue("fontSizeInput");
  } catch (e) {
    console.error("既存データの読み込みに失敗しました:", e);
  }
}

/* ── ログイン ──
   editor.html はログイン済みの管理者だけが使える。
   Firestore 側も arUsers への書き込みは request.auth != null 必須にする想定。 */
const loginScreen = document.getElementById("login-screen");
const appWrapper   = document.getElementById("app-wrapper");

async function doLogin() {
  const email    = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errEl    = document.getElementById("loginError");
  const btn      = document.getElementById("loginBtn");

  errEl.textContent = "";
  btn.disabled = true;
  btn.innerText = "ログイン中...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    errEl.textContent = "ログインに失敗しました。メールアドレスかパスワードをご確認ください。";
    console.error("❌ ログインエラー:", e);
  }

  btn.disabled = false;
  btn.innerText = "ログイン";
}

document.getElementById("loginBtn").onclick = doLogin;
document.getElementById("loginPassword").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doLogin();
});

document.getElementById("logoutBtn").onclick = () => signOut(auth);

async function bootEditor() {
  const params = new URLSearchParams(window.location.search);
  const idParam = params.get("id");
  if (idParam) document.getElementById("markerId").value = idParam;

  populateFxTemplateSelect();
  await loadExistingData(document.getElementById("markerId").value);
  updatePreview();
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    loginScreen.style.display = "none";
    appWrapper.style.display  = "flex";
    await bootEditor();
  } else {
    loginScreen.style.display = "flex";
    appWrapper.style.display  = "none";
  }
});

document.getElementById("saveBtn").onclick = async() => {

  const markerId = document.getElementById("markerId").value;
  const mindUrl = document.getElementById("mindUrlInput").value.trim();

  const saveBtn = document.getElementById("saveBtn");

  saveBtn.disabled = true;
  saveBtn.innerText = "保存中...";
  document.getElementById("saveMessage").style.display="none";

  try{

    if(!markerId.trim()){
      throw new Error("ドキュメントIDを入力してください。");
    }

    if(!mindUrl){
      throw new Error("MindARターゲットURL（.mind）を入力してください。エフェクトだけを変更する場合も必要です。");
    }

    const payload = {

      name: document.getElementById("nameInput").value,
      job: document.getElementById("jobInput").value,

      font: document.getElementById("fontSelect").value,
      fontSize: parseInt(document.getElementById("fontSizeInput").value),
      nameColor: document.getElementById("nameColorInput").value,
      jobColor: document.getElementById("jobColorInput").value,
      accentColor: document.getElementById("accentColorInput").value,

      mindUrl,

      effect: {
        templateId: document.getElementById("effectTemplateSelect").value,
        color: document.getElementById("effectColorInput").value
      },

      instagram: document.getElementById("instagramInput")?.value || "",
      x: document.getElementById("xInput")?.value || "",
      hp: document.getElementById("HPInput")?.value || "",
      line: document.getElementById("lineInput")?.value || ""

    };

    // 写真を選び直した時だけ images/ratios を送信する（既存写真を消さない）
    if (photosChanged) {
      payload.images = imagesBase64;
      payload.ratios = imageRatios;
    }

    const payloadBytes=getUtf8ByteLength(JSON.stringify(payload));
    const photoBytes=imagesBase64.reduce((total,image)=>total+getUtf8ByteLength(image),0);
    const sizeMessage=`送信データ: ${formatBytes(payloadBytes)} / 1024.0KB\n画像データ: ${formatBytes(photoBytes)}（${imagesBase64.length}枚）`;

    if(payloadBytes>FIRESTORE_DOCUMENT_LIMIT){
      showSaveMessage(`${sizeMessage}\n容量超過のため保存できません。写真を減らすか、画像サイズを下げてください。`,"error");
      throw new Error("Firestore document size limit exceeded");
    }

    if(payloadBytes>=FIRESTORE_WARNING_LIMIT){
      showSaveMessage(`${sizeMessage}\n容量上限に近いため、保存できない可能性があります。`,"warning");
    }

    await setDoc(doc(db, "arUsers", markerId), payload, { merge: true });

    alert("✓ 保存完了しました");
    showSaveMessage(`${sizeMessage}\n保存しました。`,"success");
    console.log("💾 Firestore 保存完了");

  }catch(e){

    if(isFirestoreSizeError(e)){
      showSaveMessage("容量超過のため保存できませんでした。写真を減らすか、画像サイズを下げてください。","error");
    }else{
      showSaveMessage(`保存に失敗しました。\n${e.message||"Firestoreとの通信を確認してください。"}`,"error");
    }
    alert("✗ 保存に失敗しました。画面のメッセージを確認してください。");
    console.error("❌ 保存エラー:", e);

  }

  saveBtn.disabled = false;
  saveBtn.innerText = "FIRESTOREへ保存";

};

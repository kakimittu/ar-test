<style>

body{
margin:0;
overflow:hidden;
background:#000;
}

@font-face{
  font-family:'CorporateMincho';
  src:url('./assets/fonts/Corporate-Mincho-ver3.woff2') format('woff2'),
      url('./assets/fonts/Corporate-Mincho-ver3.woff2') format('woff');
  font-display: swap;
  font-weight: normal;
  font-style: normal;
}

:root{
--accent:#D99A3E;
--ink:#F6F1E4;
}

/* HUD: マーカー検出中（未ロック） */
.hud-scan{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
pointer-events:none;
z-index:10001;
}

.reticle{
position:relative;
width:120px;
height:120px;
margin-bottom:14px;
}

.reticle .corner{
position:absolute;
width:18px;
height:18px;
border-color:var(--accent);
opacity:.85;
}
.reticle .corner.tl{top:0;left:0;border-top:2px solid;border-left:2px solid;}
.reticle .corner.tr{top:0;right:0;border-top:2px solid;border-right:2px solid;}
.reticle .corner.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid;}
.reticle .corner.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid;}

.scanline{
position:absolute;
left:8%;
right:8%;
height:1px;
top:12%;
background:linear-gradient(90deg,transparent,rgba(217,154,62,0.85),transparent);
animation:scanmove 2.4s ease-in-out infinite;
}

@keyframes scanmove{
0%,100%{top:12%;}
50%{top:88%;}
}

@media (prefers-reduced-motion:reduce){
.scanline{animation:none; top:50%;}
}

.scan-status{
font-family:monospace;
font-size:11px;
letter-spacing:.14em;
text-transform:uppercase;
color:var(--accent);
text-shadow:0 0 6px rgba(217,154,62,.6);
}

/* HUD: マーカーロック後 */
.hud-locked{
position:fixed;
top:20px;
left:20px;
display:none;
align-items:center;
gap:6px;
font-family:monospace;
font-size:11px;
letter-spacing:.1em;
text-transform:uppercase;
color:rgba(246,241,228,.85);
pointer-events:none;
z-index:10001;
}

.pulse-dot{
width:7px;
height:7px;
border-radius:50%;
background:var(--accent);
box-shadow:0 0 6px var(--accent);
flex-shrink:0;
}


/* SNS */

.sns-container{
position:fixed;
bottom:25px;
right:25px;
display:flex;
flex-direction:row-reverse;
gap:14px;
z-index:10002;
}

#insta-link,
#x-link,
#line-link,
#hp-link{
display:none;
}

.btn-border-shadow{
display:flex;
justify-content:center;
align-items:center;
width:28px;
height:28px;
cursor:pointer;
text-decoration:none;
background:rgba(0,0,0,0.35);
border:1px solid rgba(255,255,255,0.55);
border-radius:50%;
transition:background .2s ease;
}

.btn-border-shadow:hover{
background:rgba(0,0,0,0.55);
}

.btn-border-shadow img{
width:55%;
height:55%;
object-fit:contain;
}

</style>

<body>

<div class="hud-scan" id="hudScan">
<div class="reticle">
<span class="corner tl"></span><span class="corner tr"></span>
<span class="corner bl"></span><span class="corner br"></span>

</div>
<div class="scan-status">Searching Marker…</div>
</div>

</div>


<div class="sns-container">

<a href="#" id="line-link" target="_blank" class="btn-border-shadow">

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAHJPzHf4QR3V4GOcd0l3s-_VvSSYeWZAA",
authDomain:"armisetai.firebaseapp.com",
projectId:"armisetai",
storageBucket:"armisetai.firebasestorage.app",
messagingSenderId:"1006973944547",
appId:"1:1006973944547:web:adc5e195039585bbdabbd6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

// MindARのデフォルトtargetファイル（assets/targets/に.mindファイルを配置）
const DEFAULT_MIND_URL="assets/targets/pattern-AKA2.mind";

let currentIndex=0;
let items=[];
let arTarget=null;
let sceneInitialized=false;
let dotsPlane=null;
let hudScan=null;
let hudLocked=null;


/* 日本語Canvas */

async function createTextTexture(text,color,fontSize="50px",fontFamily="sans-serif",align="center",aspect=4){

  const H=128;
  const W=Math.round(H*aspect);

  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;

  const ctx=canvas.getContext("2d");

  try{
    await document.fonts.load(`bold ${fontSize} "${fontFamily}"`);
  }catch(e){}

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=color;
  ctx.font=`bold ${fontSize} "${fontFamily}", sans-serif`;
  ctx.textBaseline="middle";

  if(align==="left"){
    ctx.textAlign="left";
    ctx.fillText(text,28,H/2);
  }else{
    ctx.textAlign="center";
    ctx.fillText(text,W/2,H/2);
  }

  return canvas.toDataURL();

}


/* 肩書き（先頭にアクセントの小さな四角） */

async function createJobTexture(text,color,accentColor,fontSize="45px",fontFamily="sans-serif",aspect=4,align="left"){

  const H=128;
  const W=Math.round(H*aspect);

  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;

  const ctx=canvas.getContext("2d");

  try{
    await document.fonts.load(`500 ${fontSize} "${fontFamily}"`);
  }catch(e){}

  ctx.clearRect(0,0,W,H);
  ctx.font=`500 ${fontSize} "${fontFamily}", sans-serif`;

  const squareSize=10;
  const gap=14;
  let squareX=28;
  let textX=50;

  if(align==="center"){
    const textWidth=ctx.measureText(text).width;
    const totalWidth=squareSize+gap+textWidth;
    squareX=(W-totalWidth)/2;
    textX=squareX+squareSize+gap;
  }

  ctx.fillStyle=accentColor;
  ctx.fillRect(squareX,H/2-squareSize/2,squareSize,squareSize);

  ctx.fillStyle=color;
  ctx.textAlign="left";
  ctx.textBaseline="middle";
  ctx.fillText(text,textX,H/2);

  return canvas.toDataURL();

}


/* 名札の下に落ちる影（浮遊していることを示す） */

function createShadowTexture(){
  const W=512,H=128;
  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;
  const ctx=canvas.getContext("2d");
  const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W/2);
  grad.addColorStop(0,"rgba(0,0,0,0.5)");
  grad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  return canvas.toDataURL();
}

const SHADOW_TEXTURE=createShadowTexture();


/* カルーセル位置インジケータ */

function createDotsTexture(count,activeIndex){
  const W=512, H=40, gap=10;
  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,W,H);
  const segW=(W-gap*(count-1))/count;
  for(let i=0;i<count;i++){
    const x=i*(segW+gap);
    ctx.fillStyle=i===activeIndex?"#F6F1E4":"rgba(255,255,255,0.35)";
    roundRect(ctx,x,H/2-3,segW,6,3);
    ctx.fill();
  }
  return canvas.toDataURL();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* MindAR シーン初期化 */

function initARScene(mindUrl){

  const scene=document.createElement("a-scene");

  scene.setAttribute("mindar-image","imageTargetSrc: "+mindUrl+"; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 20;");
  scene.setAttribute("vr-mode-ui","enabled: false");
  scene.setAttribute("device-orientation-permission-ui","enabled: false");

  const camera=document.createElement("a-camera");
  camera.setAttribute("position","0 0 0");
  camera.setAttribute("look-controls","enabled: false");
  scene.appendChild(camera);

  arTarget=document.createElement("a-entity");
  arTarget.setAttribute("mindar-image-target","targetIndex: 0");
  arTarget.setAttribute("animation__found","property: scale; from: 0.85 0.85 0.85; to: 1 1 1; dur: 250; easing: easeOutQuad; startEvents: targetFound");
  scene.appendChild(arTarget);

  arTarget.addEventListener("targetFound",()=>{
    hudScan.style.display="none";
    hudLocked.style.display="flex";
  });

  arTarget.addEventListener("targetLost",()=>{
    hudScan.style.display="flex";
    hudLocked.style.display="none";
  });

  document.body.appendChild(scene);
  sceneInitialized=true;

}


/* カルーセル更新 */

function updateCarousel(){

  items.forEach((item,index)=>{

    const isCenter=(index===currentIndex);
    const offset=(index-currentIndex)*1.5; // 画像幅1.3+余白0.2

    item.setAttribute("visible",Math.abs(index-currentIndex)<=1?"true":"false");
    item.setAttribute("position",`${offset} 0 0`);
    item.setAttribute("scale",isCenter?"1 1 1":"0.75 0.75 0.75");

  });

  if(dotsPlane){
    dotsPlane.setAttribute("material","src",createDotsTexture(items.length,currentIndex));
  }

}


window.addEventListener("load",()=>{

const urlParams=new URLSearchParams(window.location.search);
const markerId=urlParams.get("id")||"akazawa";

hudScan=document.getElementById("hudScan");
hudLocked=document.getElementById("hudLocked");

if(urlParams.get("edit")==="1"){
  const editBtn=document.createElement('a');
  editBtn.href=`editor.html?id=${markerId}`;
  editBtn.textContent='EDIT';
  editBtn.style.position='fixed';
  editBtn.style.top='20px';
  editBtn.style.right='20px';
  editBtn.style.padding='8px 10px';
  editBtn.style.background='rgba(255,255,255,0.9)';
  editBtn.style.color='#000';
  editBtn.style.borderRadius='6px';
  editBtn.style.zIndex='10003';
  editBtn.style.textDecoration='none';
  editBtn.style.fontFamily='sans-serif';
  document.body.appendChild(editBtn);
}


/* SNSボタン */

const lineBtn=document.getElementById("line-link");
const xBtn=document.getElementById("x-link");
const instaBtn=document.getElementById("insta-link");
const hpBtn=document.getElementById("hp-link");

function setSNS(button,url){
  if(url&&url.trim()!==""){
    button.href=url;
    button.style.display="flex";
  }else{
    button.style.display="none";
  }
}

// SNSボタンのタップでカルーセルが進まないようにする
document.querySelectorAll(".sns-container a").forEach(btn=>{
  btn.addEventListener("click",(e)=>e.stopPropagation());
});


/* クリック操作 */

window.addEventListener("click",()=>{
  if(items.length===0) return;
  currentIndex=(currentIndex+1)%items.length;
  updateCarousel();
});


/* スワイプ操作 */

let startX=0;

window.addEventListener("touchstart",(e)=>{
  startX=e.touches[0].clientX;
});

window.addEventListener("touchend",(e)=>{
  const diff=e.changedTouches[0].clientX-startX;
  if(Math.abs(diff)>50){
    currentIndex=diff>0
      ?(currentIndex-1+items.length)%items.length
      :(currentIndex+1)%items.length;
    updateCarousel();
  }
});


/* Firestore リアルタイム同期 */

onSnapshot(doc(db,"arUsers",markerId),async(docSnap)=>{

  if(!docSnap.exists()) return;

  const data=docSnap.data();

  setSNS(lineBtn,data.line);
  setSNS(xBtn,data.x);
  setSNS(instaBtn,data.instagram);
  setSNS(hpBtn,data.hp);

  // シーン未初期化の場合はmindUrlを使って初期化
  if(!sceneInitialized){
    const mindUrl=data.mindUrl||DEFAULT_MIND_URL;
    initARScene(mindUrl);
  }

  const images=data.images||[];
  const ratios=data.ratios||[];

  // ARコンテンツをリセット
  while(arTarget.firstChild){
    arTarget.removeChild(arTarget.firstChild);
  }
  items=[];
  currentIndex=0;

  const baseW=1.3;
  const maxRatio=ratios.length>0?Math.max(...ratios):1;

  const nameFontFamily=data.font||"sans-serif";
  const nameFontSize=data.fontSize?`${data.fontSize}px`:"56px";
  const nameColor=data.nameColor||"#F6F1E4";
  const jobFontFamily=data.font||"sans-serif";
  const jobFontSize=data.fontSize?`${Math.max(30,Math.round(data.fontSize*0.6))}px`:"34px";
  const jobColor=data.jobColor||"#CBB99E";
  const accentColor=data.accentColor||"#D99A3E";

  dotsPlane=null;

  // 各画像スライド（写真の上に浮く名札）
  for(let i=0;i<images.length;i++){

    const url=images[i];
    const ratio=ratios[i]||1;
    const imgH=baseW*ratio;

    const container=document.createElement("a-entity");
    container.setAttribute("visible","false");

    const aImg=document.createElement("a-image");
    aImg.setAttribute("src",url);
    aImg.setAttribute("material","shader:flat;transparent:true;side:double");
    aImg.setAttribute("width",baseW);
    aImg.setAttribute("height",imgH.toFixed(3));
    aImg.setAttribute("position","0 0 0.01");
    container.appendChild(aImg);

    // 写真上部に落ちる影（名札が浮いていることを示す）
    const shadow=document.createElement("a-plane");
    shadow.setAttribute("width",(baseW*0.55).toFixed(3));
    shadow.setAttribute("height","0.05");
    shadow.setAttribute("position",`0 ${(imgH/2-0.10).toFixed(3)} 0.012`);
    shadow.setAttribute("material",{src:SHADOW_TEXTURE,transparent:true,shader:"flat"});
    container.appendChild(shadow);

    // 写真の上に浮く名札（ゆっくり上下にゆれる）
    const plateGroup=document.createElement("a-entity");
    const plateY=imgH/2+0.20;
    plateGroup.setAttribute("position",`0 ${plateY.toFixed(3)} 0.02`);
    plateGroup.setAttribute("animation","property: position; dir: alternate; loop: true; dur: 2200; easing: easeInOutSine; to: 0 " + (plateY+0.035).toFixed(3) + " 0.02");
    container.appendChild(plateGroup);

    // 名前
    const nameH=0.16;
    const nameSrc=await createTextTexture(data.name||"NO NAME",nameColor,nameFontSize,nameFontFamily,"center",baseW/nameH);
    const nPlane=document.createElement("a-plane");
    nPlane.setAttribute("width",baseW.toFixed(3));
    nPlane.setAttribute("height",nameH.toFixed(3));
    nPlane.setAttribute("position","0 0.05 0");
    nPlane.setAttribute("material",{src:nameSrc,transparent:true,shader:"flat"});
    plateGroup.appendChild(nPlane);

    // 肩書き
    const jobH=0.11;
    const jobSrc=await createJobTexture(data.job||"NO TITLE",jobColor,accentColor,jobFontSize,jobFontFamily,baseW/jobH,"center");
    const jPlane=document.createElement("a-plane");
    jPlane.setAttribute("width",baseW.toFixed(3));
    jPlane.setAttribute("height",jobH.toFixed(3));
    jPlane.setAttribute("position","0 -0.06 0.001");
    jPlane.setAttribute("material",{src:jobSrc,transparent:true,shader:"flat"});
    plateGroup.appendChild(jPlane);

    items.push(container);
    arTarget.appendChild(container);

  }

  // カルーセル位置インジケータ（写真が複数あるときのみ）
  if(images.length>1){
    dotsPlane=document.createElement("a-plane");
    dotsPlane.setAttribute("width",(baseW*0.5).toFixed(3));
    dotsPlane.setAttribute("height","0.05");
    dotsPlane.setAttribute("position",`0 ${((baseW*maxRatio)/2-0.12).toFixed(3)} 0.02`);
    dotsPlane.setAttribute("material",{src:createDotsTexture(images.length,currentIndex),transparent:true,shader:"flat"});
    arTarget.appendChild(dotsPlane);
  }

  updateCarousel();

});

});

</script>
